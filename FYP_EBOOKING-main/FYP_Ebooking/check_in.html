<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHECK IN - QUEST MENU</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Poppins:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style_index.css">

    <!-- Supabase SDK & config -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./supabase-config.js"></script>
    <script src="./auth-guard.js"></script>

    <style>
        body { 
            background-color: #1b1d1e; 
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .main-quest-box {
            background-color: #ffffff;
            border: 8px solid #393B3D;
            box-shadow: 15px 15px 0px rgba(0,0,0,0.5);
            max-width: 800px;
            width: 95%;
            margin: 20px auto;
            padding: 0;
            overflow: hidden;
            /* FIX: hadkan tinggi keseluruhan box supaya tak terpotong
               oleh viewport bila senarai booking panjang */
            max-height: 85vh;
            display: flex;
            flex-direction: column;
        }

        .quest-list-container {
            /* FIX: bahagian ni je yang scroll, header & footer kekal statik */
            overflow-y: auto;
            flex: 1 1 auto;
            min-height: 0;
        }

        /* Scrollbar kemas (optional, tak wajib) */
        .quest-list-container::-webkit-scrollbar {
            width: 10px;
        }
        .quest-list-container::-webkit-scrollbar-thumb {
            background-color: #393B3D;
            border-radius: 0;
        }
        .quest-list-container::-webkit-scrollbar-track {
            background-color: #f0f0f0;
        }

        .quest-header-blue {
            background-color: var(--roblox-blue, #00A2FF);
            color: white;
            padding: 15px;
            border-bottom: 6px solid #393B3D;
            text-align: center;
        }

        .quest-item {
            display: flex;
            align-items: center;
            padding: 20px;
            border-bottom: 4px solid #eeeeee;
            transition: 0.2s;
        }

        .quest-item:hover {
            background-color: #f8f9fa;
        }

        .quest-item:last-child {
            border-bottom: none;
        }

        .quest-icon-frame {
            width: 60px;
            height: 60px;
            background: #f0f0f0;
            border: 3px solid #393B3D;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            margin-right: 20px;
            flex-shrink: 0;
        }

        .quest-info {
            flex-grow: 1;
        }

        .quest-status-btn {
            min-width: 140px;
        }

        .timer-flash {
            color: var(--roblox-red, #E2231A);
            font-weight: bold;
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-dark p-3 shadow">
        <div class="container text-uppercase">
            <a class="navbar-brand font-bungee text-white" href="#"><i class="bi bi-list-task"></i> SYSTEM MENU</a>
            <button class="btn btn-primary btn-sm font-bungee border-2 border-white" onclick="window.location.href='home.html'">BACK TO LOBBY</button>
        </div>
    </nav>

    <div class="container flex-grow-1 d-flex align-items-center justify-content-center">
        <div class="main-quest-box">

            <div class="quest-header-blue">
                <h2 class="font-bungee mb-0">BOOKING PENDING</h2>
            </div>

            <div class="quest-list-container" id="questList">
                <div class="text-center p-5">
                    <div class="spinner-border" role="status"></div>
                    <p class="mt-3 text-muted">Memuatkan tempahan anda...</p>
                </div>
            </div>

            <div class="p-3 bg-light text-center border-top border-3">
                <small class="fw-bold text-muted uppercase">PLEASE COMPLETE YOUR BOOKINGS TO AVOID TERMINATION.</small>
            </div>

        </div> 
    </div>

    <script>
        // FIX: pastikan window.supabaseClient wujud walau macam mana pun
        // supabase-config.js declare pembolehubah 'supabaseClient'.
        if (typeof window.supabaseClient === 'undefined' && typeof supabaseClient !== 'undefined') {
            window.supabaseClient = supabaseClient;
        }

        // NOTA: Table 'bookings' anda guna column 'booked_by' (varchar, nama user)
        // untuk kenal pasti pemilik tempahan -- BUKAN 'user_id' (yang tidak diisi
        // semasa proses booking). Jadi kita filter ikut 'booked_by'.
        //
        // STATUS CONSTANTS -- DISERAGAMKAN (uppercase) dengan BookingDfk.html
        // & home.html. Sebelum ni 'checked_in' (lowercase) tak sepadan dengan
        // 'PENDING'/'CANCELLED' (uppercase) yang digunakan di tempat lain, dan
        // PENDING_STATUS lama ('Pending') tak pernah dipakai pun.
        const STATUS_PENDING = 'PENDING';
        const STATUS_CHECKED_IN = 'CHECKED_IN';

        let currentBookings = [];

        async function loadPendingBookings() {
            const questContainer = document.getElementById('questList');

            // Guna nama user yang sama macam disimpan semasa proses booking
            const currentUser = localStorage.getItem('currentUser');

            if (typeof window.supabaseClient === 'undefined' || !window.supabaseClient) {
                questContainer.innerHTML = `
                    <div class="text-center p-5">
                        <i class="bi bi-exclamation-triangle-fill fs-1 text-danger"></i>
                        <h4 class="font-bungee text-muted mt-2">SISTEM TIDAK TERSEDIA</h4>
                        <p class="small text-secondary mb-0">Gagal sambung ke pangkalan data. Sila cuba log masuk semula.</p>
                    </div>`;
                return;
            }

            if (!currentUser) {
                questContainer.innerHTML = `
                    <div class="text-center p-5">
                        <i class="bi bi-person-x-fill fs-1 text-danger"></i>
                        <h4 class="font-bungee text-muted mt-2">SILA LOG MASUK SEMULA</h4>
                    </div>`;
                return;
            }

            const { data, error } = await window.supabaseClient
            .from('bookings')
            .select('*')
             .eq('booked_by', currentUser)
              .in('status', ['PENDING', 'CHECKED_IN'])
             .order('created_at', { ascending: false });

            if (error) {
                console.error('Gagal fetch bookings:', error);
                questContainer.innerHTML = `
                    <div class="text-center p-5">
                        <i class="bi bi-exclamation-triangle-fill fs-1 text-danger"></i>
                        <h4 class="font-bungee text-muted mt-2">RALAT MEMUATKAN DATA</h4>
                        <p class="small text-secondary mb-0">${error.message}</p>
                    </div>`;
                return;
            }

            currentBookings = data || [];

            if (currentBookings.length === 0) {
                questContainer.innerHTML = `
                    <div class="text-center p-5">
                        <i class="bi bi-inbox fs-1 text-muted"></i>
                        <h4 class="font-bungee text-muted mt-2">NO PENDING BOOKINGS</h4>
                        <p class="small text-secondary mb-0">Please book a classroom first in the booking menu.</p>
                    </div>
                `;
                return;
            }

            questContainer.innerHTML = '';

            currentBookings.forEach((b, index) => {
                const isCheckedIn = b.status === STATUS_CHECKED_IN;

                const questItem = document.createElement('div');
                questItem.className = `quest-item ${isCheckedIn ? 'opacity-75 bg-light' : ''}`;

                questItem.innerHTML = `
                    <div class="quest-icon-frame">
                        <i class="bi ${isCheckedIn ? 'bi-check-circle-fill text-success' : 'bi-box-fill text-primary'}"></i>
                    </div>
                    <div class="quest-info">
                        <h4 class="font-bungee mb-0">${b.room_name || 'CLASSROOM'}</h4>
                        <p class="mb-0 small fw-bold text-muted">SUBJECT: ${(b.subject || '-').toUpperCase()}</p>
                        <p class="mb-0 small text-uppercase">LECTURER: <span class="text-dark fw-bold">${(b.lecturer || '-').toUpperCase()}</span></p>
                        <p class="mb-0 small text-uppercase">BOOKED BY: <span class="text-dark fw-bold">${b.booked_by || '-'}</span></p>
                        <small class="text-muted">DATE: ${b.booking_date || '-'} &bull; ${b.start_time || ''}-${b.end_time || ''} &bull; STATUS: ${(b.status || '-').toUpperCase()}</small>
                    </div>
                    <div class="quest-action text-end d-flex flex-column align-items-end gap-1">
                        ${isCheckedIn ? 
                            `<button class="btn btn-roblox btn-secondary quest-status-btn" disabled><i class="bi bi-check2"></i> CHECKED IN</button>` : 
                            `<div class="timer-flash small"><i class="bi bi-clock-history"></i> PENDING</div>
                             <button class="btn btn-roblox btn-success quest-status-btn" onclick="confirmCheckIn(${index})">CHECK IN</button>`
                        }
                        <button class="btn btn-link text-danger p-0 text-decoration-none small" style="font-size:0.75rem;" onclick="deleteBooking(${index})"><i class="bi bi-trash"></i> Cancel</button>
                    </div>
                `;

                questContainer.appendChild(questItem);
            });
        }

        // FIX: dipulihkan ke UPDATE status (bukan DELETE) — sebelum ni kod debug
        // untuk deleteBooking() tersalah letak di sini, jadi butang CHECK IN
        // sebenarnya memadam row, bukan tandakan checked-in.
        async function confirmCheckIn(index) {
            const booking = currentBookings[index];
            if (!booking) return;

            const { error } = await window.supabaseClient
                .from('bookings')
                .update({ status: STATUS_CHECKED_IN })
                .eq('id', booking.id);

            if (error) {
                alert('Gagal check-in: ' + error.message);
                console.error(error);
                return;
            }

            alert("MISSION COMPLETE! You have checked in to " + (booking.room_name || 'the room') + ".");
            loadPendingBookings();
        }

        // FIX: ditambah .select() + console.log + semakan data.length supaya
        // kita nampak betul-betul berapa row terpadam (bukan hanya percaya
        // status 204/tiada error, yang boleh "berjaya" walaupun 0 row match).
        async function deleteBooking(index) {
    const booking = currentBookings[index];
    if (!booking) return;

    if (confirm("Are you sure you want to cancel this booking?")) {

        const { data, error } = await window.supabaseClient
            .from('bookings')
            .update({ status: 'CANCELLED' })
            .eq('id', booking.id)
            .select();

        console.log('Cancel result:', data, error);

        if (error) {
            alert('Gagal batalkan tempahan: ' + error.message);
            console.error(error);
            return;
        }

        if (!data || data.length === 0) {
            alert('Booking tidak dapat dibatalkan.');
            console.warn('0 row dikemaskini untuk id:', booking.id);
            return;
        }

        alert('Booking berjaya dibatalkan!');
        loadPendingBookings();
    }
}

        document.addEventListener('DOMContentLoaded', loadPendingBookings);
    </script>
</body>
</html>
