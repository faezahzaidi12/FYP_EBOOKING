<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <title>CHECK IN - QUEST MENU</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Poppins:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style_index.css">
    <style>
        body { 
            background-color: #1b1d1e; 
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Kotak Bingkai Utama (Macam UI Roblox) */
        .main-quest-box {
            background-color: #ffffff;
            border: 8px solid #393B3D;
            box-shadow: 15px 15px 0px rgba(0,0,0,0.5);
            max-width: 800px;
            width: 95%;
            margin: 20px auto;
            padding: 0;
            overflow: hidden;
        }

        .quest-header-blue {
            background-color: var(--roblox-blue, #00A2FF);
            color: white;
            padding: 15px;
            border-bottom: 6px solid #393B3D;
            text-align: center;
        }

        /* Senarai di dalam box */
        .quest-item {
            display: flex;
            align-items: center;
            padding: 20px;
            border-bottom: 4px solid #eeeeee;
            transition: 0.2s;
        }

        .quest-item:hover {
            background-color: #f8f9fa;
        }

        .quest-item:last-child {
            border-bottom: none;
        }

        .quest-icon-frame {
            width: 60px;
            height: 60px;
            background: #f0f0f0;
            border: 3px solid #393B3D;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            margin-right: 20px;
            flex-shrink: 0;
        }

        .quest-info {
            flex-grow: 1;
        }

        .quest-status-btn {
            min-width: 140px;
        }

        .timer-flash {
            color: var(--roblox-red, #E2231A);
            font-weight: bold;
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-dark p-3 shadow">
        <div class="container text-uppercase">
            <a class="navbar-brand font-bungee text-white" href="#"><i class="bi bi-list-task"></i> SYSTEM MENU</a>
            <button class="btn btn-primary btn-sm font-bungee border-2 border-white" onclick="window.location.href='../home.html'">BACK TO LOBBY</button>
        </div>
    </nav>

    <div class="container flex-grow-1 d-flex align-items-center justify-content-center">
        <div class="main-quest-box">
            
            <!-- Header Box -->
            <div class="quest-header-blue">
                <h2 class="font-bungee mb-0">BOOKING PENDING</h2>
            </div>

            <!-- Bekas Senarai Dynamic (Akan diisi secara automatik oleh JS) -->
            <div class="quest-list-container" id="questList">
                <!-- Data dari localStorage akan muncul di sini -->
            </div>

            <!-- Footer Box -->
            <div class="p-3 bg-light text-center border-top border-3">
                <small class="fw-bold text-muted uppercase">PLEASE COMPLETE YOUR BOOKINGS TO AVOID TERMINATION.</small>
            </div>

        </div> 
    </div>

    <script>
        // Fungsi untuk membaca dan memaparkan tempahan dari localStorage
        function loadPendingBookings() {
            const questContainer = document.getElementById('questList');
            
            // Ambil data yang disimpan semasa pengguna buat booking di booking.html
            const savedData = localStorage.getItem('mySavedBookings');
            let myBookings = savedData ? JSON.parse(savedData) : [];

            // Jika TIADA sebarang tempahan
            if (myBookings.length === 0) {
                questContainer.innerHTML = `
                    <div class="text-center p-5">
                        <i class="bi bi-inbox fs-1 text-muted"></i>
                        <h4 class="font-bungee text-muted mt-2">NO PENDING BOOKINGS</h4>
                        <p class="small text-secondary mb-0">Please book a classroom first in the booking menu.</p>
                    </div>
                `;
                return;
            }

            // Kosongkan bekas sebelum mengisi data baharu
            questContainer.innerHTML = '';

            // Hasilkan item quest bagi setiap tempahan
            myBookings.forEach((b, index) => {
                const isCheckedIn = b.status === 'CHECKED IN';
                
                // Formatkan waktu tamat slot (Contoh 08:00 -> 09:00)
                const startHour = parseInt(b.slot);
                const endHour = String(startHour + 1).padStart(2, '0') + ':00';
                
                const questItem = document.createElement('div');
                questItem.className = `quest-item ${isCheckedIn ? 'opacity-75 bg-light' : ''}`;

                questItem.innerHTML = `
                    <div class="quest-icon-frame">
                        <i class="bi ${isCheckedIn ? 'bi-check-circle-fill text-success' : 'bi-box-fill text-primary'}"></i>
                    </div>
                    <div class="quest-info">
                        <h4 class="font-bungee mb-0">${b.facility || 'CLASSROOM'}</h4>
                        <p class="mb-0 small fw-bold text-muted">PURPOSE: ${(b.purpose || 'CLASS').toUpperCase()}</p>
                        <p class="mb-0 small text-uppercase">DATE & TIME: <span class="text-dark fw-bold">${b.date} (${b.slot} - ${endHour})</span></p>
                        <small class="text-muted">REF: ${b.reference}</small>
                    </div>
                    <div class="quest-action text-end d-flex flex-column align-items-end gap-1">
                        ${isCheckedIn ? 
                            `<button class="btn btn-roblox btn-secondary quest-status-btn" disabled><i class="bi bi-check2"></i> CHECKED IN</button>` : 
                            `<div class="timer-flash small"><i class="bi bi-clock-history"></i> PENDING</div>
                             <button class="btn btn-roblox btn-success quest-status-btn" onclick="confirmCheckIn(${index})">CHECK IN</button>`
                        }
                        <button class="btn btn-link text-danger p-0 text-decoration-none small" style="font-size:0.75rem;" onclick="deleteBooking(${index})"><i class="bi bi-trash"></i> Cancel</button>
                    </div>
                `;

                questContainer.appendChild(questItem);
            });
        }

        // Fungsi apabila butang CHECK IN ditekan
        function confirmCheckIn(index) {
            const savedData = localStorage.getItem('mySavedBookings');
            let myBookings = savedData ? JSON.parse(savedData) : [];

            if (myBookings[index]) {
                // Kemaskini status tempahan
                myBookings[index].status = 'CHECKED IN';
                
                // Simpan semula status terbaharu ke localStorage
                localStorage.setItem('mySavedBookings', JSON.stringify(myBookings));

                alert("MISSION COMPLETE! You have checked in to " + (myBookings[index].facility || 'the room') + ".");
                
                // Muat semula paparan
                loadPendingBookings();
            }
        }

        // Fungsi untuk membatalkan / memadam tempahan
        function deleteBooking(index) {
            if (confirm("Are you sure you want to cancel this booking?")) {
                const savedData = localStorage.getItem('mySavedBookings');
                let myBookings = savedData ? JSON.parse(savedData) : [];

                myBookings.splice(index, 1);
                localStorage.setItem('mySavedBookings', JSON.stringify(myBookings));
                
                loadPendingBookings();
            }
        }

        // SINKRONISASI MASA-NYATA (Bila ada booking baharu dibuat di tab lain)
        window.addEventListener('storage', (e) => {
            if (e.key === 'mySavedBookings') {
                loadPendingBookings();
            }
        });

        // Jalankan fungsi sebaik sahaja halaman selesai dimuatkan
        document.addEventListener('DOMContentLoaded', loadPendingBookings);
    </script>
</body>
</html>
