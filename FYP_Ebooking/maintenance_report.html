<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MAINTENANCE REPORT</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Poppins:wght@400;700&display=swap" rel="stylesheet">

    <!--
      NOTA: style_index.css asal kau masih tak diupload. Page ni rujuk 2
      class dari situ (.font-bungee, .btn-roblox) + warna navbar — stub
      minimum di bawah SAHAJA untuk 2 benda tu. Semua styling borang
      (.mr-*) guna maintenance_report.css SEBENAR kau, tak diubah.
    -->
    <style>
        .font-bungee { font-family: 'Bungee', cursive; }
        .btn-roblox { border-radius: 0; box-shadow: 3px 3px 0 rgba(0,0,0,.3); }
        .navbar { background-color: #393B3D !important; }
        body { background: #e9ecf1; }
    </style>

    <!-- maintenance_report.css SEBENAR kau (inline untuk preview) -->
    <style>
/* Maintenance Report — matches faq-chatbot / Roblox design system */
:root {
    --mr-blue: #00A2FF;
    --mr-green: #00E223;
    --mr-red: #E2231A;
    --mr-yellow: #FFC800;
    --mr-dark: #393B3D;
}

.mr-card {
    max-width: 860px;
    margin: 0 auto;
    background: #fff;
    border: 5px solid var(--mr-dark);
    box-shadow: 10px 10px 0 rgba(0,0,0,.5);
    font-family: 'Poppins', sans-serif;
    overflow: hidden;
}

.mr-header {
    background: var(--mr-blue);
    color: #fff;
    padding: 18px 22px;
    border-bottom: 5px solid var(--mr-dark);
    font-family: 'Bungee', cursive;
    text-align: center;
}
.mr-header p { font-family: 'Poppins', sans-serif; opacity: .95; }

.mr-body { padding: 22px; background: #f5f5f5; }

.mr-label {
    display: block;
    font-family: 'Bungee', cursive;
    font-size: .8rem;
    color: var(--mr-dark);
    margin-bottom: 6px;
    letter-spacing: .5px;
}
.mr-req { color: var(--mr-red); }
.mr-hint { color: #666; font-size: .75rem; }

.mr-input {
    border: 3px solid var(--mr-dark) !important;
    border-radius: 0 !important;
    padding: 10px !important;
    font-family: 'Poppins', sans-serif;
    box-shadow: 3px 3px 0 rgba(0,0,0,.15);
    background: #fff;
}
.mr-input:focus {
    border-color: var(--mr-blue) !important;
    box-shadow: 0 0 0 4px rgba(0,162,255,.25) !important;
    outline: none;
}
.mr-input[readonly] { background: #eaeaea; }

.mr-severity { display: flex; gap: 8px; flex-wrap: wrap; }
.mr-radio {
    flex: 1;
    min-width: 90px;
    text-align: center;
    padding: 10px;
    border: 3px solid var(--mr-dark);
    box-shadow: 3px 3px 0 rgba(0,0,0,.2);
    background: #fff;
    font-family: 'Bungee', cursive;
    font-size: .8rem;
    cursor: pointer;
    transition: .15s;
}
.mr-radio input { display: none; }
.mr-radio:hover { transform: translate(-1px,-1px); box-shadow: 4px 4px 0 rgba(0,0,0,.25); }
.mr-radio.sev-low.selected { background: #d1f7d5; }
.mr-radio.sev-med.selected { background: #fff3cd; }
.mr-radio.sev-high.selected { background: #f8d7da; }
.mr-radio.selected { border-color: var(--mr-blue); }

.mr-upload {
    background: #fff;
    border: 3px dashed var(--mr-dark);
    padding: 16px;
}
.mr-previews {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
    gap: 10px;
    margin-top: 12px;
}
.mr-thumb {
    position: relative;
    border: 3px solid var(--mr-dark);
    box-shadow: 3px 3px 0 rgba(0,0,0,.25);
    aspect-ratio: 1;
    overflow: hidden;
    background: #eee;
}
.mr-thumb img { width: 100%; height: 100%; object-fit: cover; }
.mr-thumb button {
    position: absolute; top: 4px; right: 4px;
    width: 24px; height: 24px; border: 2px solid var(--mr-dark);
    background: var(--mr-red); color: #fff; font-weight: bold;
    line-height: 1; cursor: pointer; padding: 0;
}

.mr-actions {
    display: flex; justify-content: flex-end; gap: 10px;
    margin-top: 22px; padding-top: 18px;
    border-top: 3px dashed #cfcfcf;
}

/* Modal / dialog — same language */
.mr-modal-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,.55);
    display: flex; align-items: center; justify-content: center;
    z-index: 10000; padding: 16px;
}
.mr-modal {
    background: #fff; border: 5px solid var(--mr-dark);
    box-shadow: 10px 10px 0 rgba(0,0,0,.5);
    max-width: 440px; width: 100%;
    font-family: 'Poppins', sans-serif;
}
.mr-modal-head {
    background: var(--mr-blue); color: #fff;
    padding: 14px; border-bottom: 4px solid var(--mr-dark);
    font-family: 'Bungee', cursive; text-align: center;
}
.mr-modal-head.success { background: var(--mr-green); }
.mr-modal-body { padding: 20px; text-align: center; }
.mr-modal-body .mr-icon {
    font-size: 3.5rem; color: var(--mr-green); margin-bottom: 8px;
}
.mr-modal-foot {
    display: flex; gap: 10px; justify-content: flex-end;
    padding: 14px; border-top: 3px solid var(--mr-dark);
    background: #f5f5f5;
}

@media (max-width: 575.98px) {
    .mr-card { border-width: 4px; box-shadow: 6px 6px 0 rgba(0,0,0,.5); }
    .mr-body { padding: 16px; }
    .mr-header { padding: 14px; }
    .mr-actions { flex-direction: column-reverse; }
    .mr-actions .btn { width: 100%; }
}
    </style>
</head>
<body>
    <nav class="navbar navbar-dark p-3 shadow">
        <div class="container text-uppercase">
            <a class="navbar-brand font-bungee text-white" href="#"><i class="bi bi-tools"></i> MAINTENANCE REPORT</a>
            <button class="btn btn-primary btn-sm font-bungee border-2 border-white">BACK TO LOBBY</button>
        </div>
    </nav>

    <div class="container py-4">
        <div class="mr-card rbx-in">
            <div class="mr-header">
                <h2 class="font-bungee mb-1">MAINTENANCE REPORT</h2>
                <p class="mb-0 small">Report any classroom or facility issue. Your report will be sent to the administrator for review.</p>
            </div>

            <form id="mrForm" class="mr-body" novalidate>
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="mr-label">Booking Reference</label>
                        <input type="text" class="form-control mr-input" id="mrRef" readonly>
                    </div>
                    <div class="col-md-6">
                        <label class="mr-label">Room</label>
                        <input type="text" class="form-control mr-input" id="mrRoom" readonly>
                    </div>
                    <div class="col-md-6">
                        <label class="mr-label">Student Name</label>
                        <input type="text" class="form-control mr-input" id="mrName" readonly>
                    </div>
                    <div class="col-md-6">
                        <label class="mr-label">Student ID</label>
                        <input type="text" class="form-control mr-input" id="mrSid" readonly>
                    </div>

                    <div class="col-md-6">
                        <label class="mr-label" for="mrCategory">Issue Category <span class="mr-req">*</span></label>
                        <select id="mrCategory" class="form-select mr-input" required>
                            <option value="">-- Select --</option>
                            <option>Air Conditioner</option>
                            <option>Projector</option>
                            <option>Whiteboard</option>
                            <option>Chair</option>
                            <option>Table</option>
                            <option>Lighting</option>
                            <option>Electrical</option>
                            <option>Internet</option>
                            <option>Door / Lock</option>
                            <option>Cleanliness</option>
                            <option>Other</option>
                        </select>
                    </div>

                    <div class="col-md-6">
                        <label class="mr-label">Severity <span class="mr-req">*</span></label>
                        <div class="mr-severity">
                            <label class="mr-radio sev-low"><input type="radio" name="severity" value="Low" required> <span>LOW</span></label>
                            <label class="mr-radio sev-med"><input type="radio" name="severity" value="Medium"> <span>MEDIUM</span></label>
                            <label class="mr-radio sev-high"><input type="radio" name="severity" value="High"> <span>HIGH</span></label>
                        </div>
                    </div>

                    <div class="col-12">
                        <label class="mr-label" for="mrDesc">Description <span class="mr-req">*</span></label>
                        <textarea id="mrDesc" class="form-control mr-input" rows="5" minlength="20" maxlength="1000" placeholder="Describe the issue in detail..." required></textarea>
                        <small class="mr-hint"><span id="mrDescCount">0</span> / 1000 (minimum 20)</small>
                    </div>

                    <div class="col-12">
                        <label class="mr-label">Upload Images <small class="text-muted">(JPG/PNG/JPEG, max 5 files, 10MB each)</small></label>
                        <div class="mr-upload">
                            <input type="file" id="mrFiles" accept="image/jpeg,image/png,image/jpg" multiple hidden>
                            <button type="button" class="btn btn-roblox btn-primary text-white" id="mrPickBtn"><i class="bi bi-cloud-upload"></i> CHOOSE IMAGES</button>
                            <div class="mr-previews" id="mrPreviews"></div>
                        </div>
                    </div>

                    <div class="col-md-6">
                        <label class="mr-label">Report Time</label>
                        <input type="text" class="form-control mr-input" id="mrTime" readonly>
                    </div>
                </div>

                <div class="mr-actions">
                    <button type="button" class="btn btn-roblox btn-light" id="mrCancel">CANCEL</button>
                    <button type="submit" class="btn btn-roblox btn-success text-white" id="mrSubmit"><i class="bi bi-send-fill"></i> SUBMIT REPORT</button>
                </div>
            </form>
        </div>
    </div>

    <!-- maintenance_report.js SEBENAR kau (inline untuk preview) -->
    <script>
// Maintenance Report — vanilla JS, Supabase-ready, matches faq-chatbot style
(function () {
    'use strict';

    const MAX_FILES = 5;
    const MAX_SIZE = 10 * 1024 * 1024; // 10MB
    const ALLOWED = ['image/jpeg', 'image/png', 'image/jpg'];
    const LAST_SUBMIT_KEY = 'mr_last_submit_ts';

    const $ = (id) => document.getElementById(id);
    let selectedFiles = [];

    function autofill() {
        const name = localStorage.getItem('currentUser') || 'Player One';
        const sid = localStorage.getItem('currentStudentId') || 'S00000';
        const ref = localStorage.getItem('currentBookingRef') || ('BK-' + Date.now().toString().slice(-6));
        const room = localStorage.getItem('currentRoom') || 'N/A';

        $('mrName').value = name;
        $('mrSid').value = sid;
        $('mrRef').value = ref;
        $('mrRoom').value = room;
        $('mrTime').value = new Date().toLocaleString();
    }

    function wireSeverity() {
        document.querySelectorAll('.mr-radio').forEach(label => {
            label.addEventListener('click', () => {
                document.querySelectorAll('.mr-radio').forEach(l => l.classList.remove('selected'));
                label.classList.add('selected');
                const input = label.querySelector('input');
                if (input) input.checked = true;
            });
        });
    }

    function wireDesc() {
        const desc = $('mrDesc');
        const count = $('mrDescCount');
        desc.addEventListener('input', () => count.textContent = desc.value.length);
    }

    function wireFiles() {
        const input = $('mrFiles');
        $('mrPickBtn').addEventListener('click', () => input.click());
        input.addEventListener('change', (e) => {
            const files = Array.from(e.target.files || []);
            for (const f of files) {
                if (selectedFiles.length >= MAX_FILES) { alert('Maximum ' + MAX_FILES + ' images.'); break; }
                if (!ALLOWED.includes(f.type)) { alert('Only JPG/PNG allowed: ' + f.name); continue; }
                if (f.size > MAX_SIZE) { alert('Max 10MB: ' + f.name); continue; }
                selectedFiles.push(f);
            }
            input.value = '';
            renderPreviews();
        });
    }

    function renderPreviews() {
        const wrap = $('mrPreviews');
        wrap.innerHTML = '';
        selectedFiles.forEach((f, i) => {
            const url = URL.createObjectURL(f);
            const div = document.createElement('div');
            div.className = 'mr-thumb';
            div.innerHTML = `<img src="${url}" alt=""><button type="button" aria-label="Remove">×</button>`;
            div.querySelector('button').onclick = () => {
                selectedFiles.splice(i, 1);
                renderPreviews();
            };
            wrap.appendChild(div);
        });
    }

    function modal({ title, body, buttons, success }) {
        const back = document.createElement('div');
        back.className = 'mr-modal-backdrop';
        back.innerHTML = `
            <div class="mr-modal" role="dialog" aria-modal="true">
                <div class="mr-modal-head ${success ? 'success' : ''}">${title}</div>
                <div class="mr-modal-body">${body}</div>
                <div class="mr-modal-foot"></div>
            </div>`;
        const foot = back.querySelector('.mr-modal-foot');
        buttons.forEach(b => {
            const btn = document.createElement('button');
            btn.className = 'btn btn-roblox ' + (b.variant || 'btn-light');
            if (b.variant && b.variant.includes('success')) btn.classList.add('text-white');
            btn.textContent = b.label;
            btn.onclick = () => { b.onClick && b.onClick(); back.remove(); };
            foot.appendChild(btn);
        });
        const onKey = (e) => { if (e.key === 'Escape') { back.remove(); document.removeEventListener('keydown', onKey); } };
        document.addEventListener('keydown', onKey);
        document.body.appendChild(back);
        return back;
    }

    function validate() {
        const errors = [];
        if (!$('mrCategory').value) errors.push('Select an issue category.');
        if (!document.querySelector('input[name="severity"]:checked')) errors.push('Select severity.');
        const desc = $('mrDesc').value.trim();
        if (desc.length < 20) errors.push('Description must be at least 20 characters.');
        return errors;
    }

    async function uploadImages(refId) {
        if (typeof window.supabaseClient === 'undefined' || !selectedFiles.length) return [];
        const urls = [];
        for (const f of selectedFiles) {
            const path = `${refId}/${Date.now()}-${f.name.replace(/[^a-zA-Z0-9._-]/g, '_')}`;
            try {
                const { error } = await window.supabaseClient.storage
                    .from('maintenance-images').upload(path, f);
                if (!error) {
                    const { data } = window.supabaseClient.storage
                        .from('maintenance-images').getPublicUrl(path);
                    urls.push(data.publicUrl);
                }
            } catch (e) { console.warn('Upload failed', e); }
        }
        return urls;
    }

    async function submitReport() {
        const refId = $('mrRef').value;
        const payload = {
            reference_id: refId,
            booking_id: refId,
            student_id: $('mrSid').value,
            student_name: $('mrName').value,
            room: $('mrRoom').value,
            category: $('mrCategory').value,
            severity: document.querySelector('input[name="severity"]:checked').value,
            description: $('mrDesc').value.trim(),
            image_urls: [],
            report_time: new Date().toISOString(),
            status: 'Pending',
            admin_note: null
        };

        try {
            payload.image_urls = await uploadImages(refId);
            if (typeof window.supabaseClient !== 'undefined') {
                await window.supabaseClient.from('maintenance_reports').insert(payload);
            } else {
                console.info('[MR] Supabase not initialised — payload:', payload);
            }
        } catch (e) {
            console.error('Submit error', e);
        }

        localStorage.setItem(LAST_SUBMIT_KEY, Date.now().toString());
        showSuccess();
    }

    function showSuccess() {
        modal({
            success: true,
            title: 'REPORT SUBMITTED',
            body: `<div class="mr-icon"><i class="bi bi-check-circle-fill"></i></div>
                   <h5 class="font-bungee mb-2">Report Submitted Successfully</h5>
                   <p class="mb-0 small">Thank you. Your maintenance report has been sent to the administrator.</p>`,
            buttons: [
                { label: 'OK', variant: 'btn-success', onClick: () => alert('DEMO: redirect to ../home.html') }
            ]
        });
    }

    function confirmSubmit() {
        modal({
            title: 'SUBMIT MAINTENANCE REPORT?',
            body: `<p class="mb-0">Are you sure you want to submit this maintenance report?<br><small class="text-muted">You cannot edit it after submission.</small></p>`,
            buttons: [
                { label: 'CANCEL', variant: 'btn-light' },
                { label: 'SUBMIT', variant: 'btn-success', onClick: submitReport }
            ]
        });
    }

    function wireForm() {
        $('mrCancel').addEventListener('click', () => {
            if (confirm('Discard this report?')) alert('DEMO: redirect to ../home.html');
        });

        $('mrForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const errs = validate();
            if (errs.length) { alert(errs.join('\n')); return; }

            const last = parseInt(localStorage.getItem(LAST_SUBMIT_KEY) || '0', 10);
            if (last && Date.now() - last < 5 * 60 * 1000) {
                alert('Please wait before submitting another report (5-minute cooldown).');
                return;
            }
            confirmSubmit();
        });
    }

    document.addEventListener('DOMContentLoaded', () => {
        autofill();
        wireSeverity();
        wireDesc();
        wireFiles();
        wireForm();
        setInterval(() => { $('mrTime').value = new Date().toLocaleString(); }, 30000);
    });
})();
    </script>
</body>
</html>
