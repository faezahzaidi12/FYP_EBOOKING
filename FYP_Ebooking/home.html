<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HOME</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style_index.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./supabase-config.js"></script>
    <script src="./auth-guard.js"></script>

    <style>
        :root {
            --dash-dark: #25282b;
            --dash-blue: #1687ff;
            --dash-green: #179447;
            --dash-yellow: #ffc107;
            --dash-red: #dc3545;
            --dash-border: #393B3D;
        }

        html, body {
            min-height: 100%;
            overflow-x: hidden;
            overflow-y: auto !important;
        }

        body {
            font-family: 'Poppins', sans-serif;
        }

        #myVideo {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -3;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background:
                radial-gradient(circle at top left, rgba(0,162,255,.16), transparent 34%),
                radial-gradient(circle at bottom right, rgba(0,226,35,.10), transparent 30%),
                rgba(4, 13, 28, .50);
            z-index: -2;
            pointer-events: none;
        }

        .home-navbar {
            background: rgba(37, 40, 43, .93);
            border-bottom: 5px solid #00A2FF;
            backdrop-filter: blur(10px);
        }

        .home-navbar .navbar-brand {
            letter-spacing: .5px;
        }

        .home-shell {
            min-height: calc(100vh - 88px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 32px 12px 44px;
        }

        .dashboard-panel {
            width: min(860px, 96vw);
            background: rgba(255,255,255,.96);
            border: 5px solid var(--dash-border);
            border-radius: 22px;
            padding: 34px;
            box-shadow: 12px 14px 0 rgba(0,0,0,.40), 0 22px 55px rgba(0,0,0,.32);
            position: relative;
            overflow: hidden;
        }

        .dashboard-panel::before {
            content: "";
            position: absolute;
            inset: 0 0 auto 0;
            height: 8px;
            background: linear-gradient(90deg, #00A2FF, #00E223, #FFC800);
        }

        .welcome-kicker {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #eef7ff;
            color: #0d6efd;
            border: 2px solid #b9dcff;
            border-radius: 999px;
            padding: 6px 12px;
            font-weight: 700;
            font-size: .78rem;
            text-transform: uppercase;
            margin-bottom: 12px;
        }

        .welcome-title {
            font-family: 'Bungee', cursive;
            font-size: clamp(1.45rem, 3vw, 2.1rem);
            color: #25282b;
            margin-bottom: 18px;
        }

        .profile-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 26px;
        }

        /* BINGKAI AVATAR BERSIH (HIJAU/GRADIENT DIBUANG) */
        .avatar-ring {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            padding: 0;
            background: transparent;
            box-shadow: 0 10px 25px rgba(0,0,0,.15);
            transition: .25s ease;
            position: relative;
        }

        .avatar-ring::after {
            display: none; /* Buang titik hijau status */
        }

        .avatar-ring:hover {
            transform: translateY(-4px) scale(1.02);
        }

        .avatar-ring img {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover;
            background: rgba(255, 255, 255, 0.593);
            border: 4px solid var(--dash-border);
            border-radius: 50%;
        }

        .quick-card {
            height: 100%;
            background: #fff;
            border: 4px solid var(--dash-border);
            border-radius: 18px;
            padding: 22px 20px;
            box-shadow: 6px 7px 0 rgba(57,59,61,.20);
            cursor: pointer;
            transition: transform .22s ease, box-shadow .22s ease;
            position: relative;
            overflow: hidden;
        }

        .quick-card:hover {
            transform: translateY(-6px);
            box-shadow: 8px 12px 0 rgba(57,59,61,.24);
        }

        .quick-card::after {
            content: "";
            position: absolute;
            width: 90px;
            height: 90px;
            border-radius: 50%;
            right: -32px;
            bottom: -42px;
            background: rgba(13,110,253,.07);
        }

        .quick-icon {
            width: 48px;
            height: 48px;
            border: 3px solid var(--dash-border);
            border-radius: 14px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1.35rem;
            margin-bottom: 12px;
            background: #f8f9fa;
        }

        .quick-card h4 {
            font-size: 1rem;
            margin-bottom: 8px;
        }

        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            border-radius: 999px;
            padding: 6px 10px;
            font-weight: 700;
            font-size: .86rem;
        }

        .status-student {
            color: #14783b;
            background: #e8f7ee;
            border: 2px solid #bfe8ce;
        }

        .booking-action {
            margin-top: 24px;
            border: 4px solid var(--dash-border);
            border-radius: 18px;
            min-height: 76px;
            background: linear-gradient(135deg, #158c45, #22b55f);
            color: #fff;
            font-family: 'Bungee', cursive;
            font-size: clamp(1rem, 2vw, 1.45rem);
            box-shadow: 7px 8px 0 rgba(57,59,61,.35);
            transition: .22s ease;
        }

        .booking-action:hover {
            transform: translateY(-4px);
            box-shadow: 8px 12px 0 rgba(57,59,61,.42);
            color: #fff;
        }

        #checkInBox.pending-active {
            background: linear-gradient(135deg, #fff8dc, #fff1ba) !important;
        }

        @keyframes softPulse {
            0%,100% { transform: scale(1); }
            50% { transform: scale(1.015); }
        }

        .animate-pulse {
            animation: softPulse 1.5s ease-in-out infinite;
        }

        .status-card {
            border-left: 8px solid #13c768;
        }

        .checkin-card {
            border-left: 8px solid #ff9d00;
        }

        .status-card .quick-icon {
            background: #e9fff3;
            color: #13a954 !important;
        }

        .checkin-card .quick-icon {
            background: #fff4df;
            color: #ff9500 !important;
        }

        .quote-box {
            margin-top: 18px;
            background: linear-gradient(135deg, #eaf7ff, #d7efff);
            border: 2px solid #b5def6;
            border-radius: 14px;
            padding: 14px 18px;
            font-weight: 600;
            color: #2f3a46;
        }

        .quote-box i {
            color: #f4b400;
            margin-right: 8px;
        }

        .profile-subline {
            margin-top: 12px;
            font-weight: 700;
            font-size: .86rem;
            color: #5f6c78;
        }

        .profile-subline .badge {
            font-size: .75rem;
            border: 2px solid #bcdfff;
        }

        /* Maintenance-report UI */
        .mr-previews { display:flex; flex-wrap:wrap; gap:10px; margin-top:12px; }
        .mr-thumb { position:relative; width:90px; height:90px; border:3px solid #393B3D; overflow:hidden; }
        .mr-thumb img { width:100%; height:100%; object-fit:cover; cursor:pointer; }
        .mr-thumb button {
            position:absolute; top:2px; right:2px; width:22px; height:22px;
            border:2px solid #393B3D; background:#E2231A; color:white;
            font-weight:bold; font-size:14px; line-height:1; cursor:pointer;
            border-radius:50%; z-index:2;
        }

        #mrLightbox {
            display:none; position:fixed; inset:0; background:rgba(0,0,0,.85);
            z-index:100001; align-items:center; justify-content:center; cursor:zoom-out;
        }
        #mrLightbox.open { display:flex; }
        #mrLightbox img { max-width:90%; max-height:85%; border:5px solid white; box-shadow:0 0 30px rgba(0,0,0,.6); }
        #mrLightboxClose {
            position:absolute; top:20px; right:30px; background:#E2231A; border:3px solid white;
            color:white; font-size:24px; font-family:'Bungee', cursive; cursor:pointer;
            line-height:1; padding:8px 16px; display:flex; align-items:center; gap:8px;
            box-shadow:3px 3px 0 rgba(0,0,0,.4);
        }

        #reportModal .modal-dialog {
            display:flex; align-items:center; min-height:calc(100% - 1rem);
            margin:.5rem auto; max-width:500px; width:95%;
        }
        #reportModal .modal-content { max-height:90vh; overflow-y:auto; width:100%; }

        .mr-modal-backdrop {
            position:fixed; inset:0; background:rgba(0,0,0,.65); z-index:100010;
            display:flex; align-items:center; justify-content:center; padding:20px; box-sizing:border-box;
        }
        .mr-modal {
            background:#fff; border:6px solid #393B3D; box-shadow:8px 8px 0 rgba(0,0,0,.5);
            max-width:420px; width:100%; font-family:'Poppins', sans-serif; max-height:90vh; overflow-y:auto;
        }
        .mr-modal-head {
            background:#2452db; color:white; padding:14px 18px; font-family:'Bungee', cursive;
            text-transform:uppercase; font-size:15px;
        }
        .mr-modal-head.success { background:#198754; }
        .mr-modal-body { padding:20px; text-align:center; font-family:'Poppins', sans-serif; }
        .mr-modal-foot { display:flex; gap:10px; padding:16px 20px; border-top:3px solid #eee; }
        .mr-modal-foot button { flex:1; }
        .mr-icon { font-size:48px; color:#198754; margin-bottom:10px; }

        @media (max-width: 768px) {
            .dashboard-panel { padding: 26px 18px; border-radius: 18px; }
            .home-shell { align-items: flex-start; padding-top: 22px; }
            .avatar-ring { width: 116px; height: 116px; }
            .quick-card { text-align: left; }
            .quick-card .quick-icon { margin-bottom: 10px; }
            .home-navbar .container { gap: 10px; }
            .home-navbar .navbar-brand { font-size: .92rem; }
        }

        @media (max-width: 480px) {
            .home-navbar .container { align-items:flex-start !important; }
            .home-navbar .d-flex.gap-2 { gap:6px !important; }
            .home-navbar .btn { font-size:.68rem; padding:.45rem .55rem; }
            .dashboard-panel { width: 100%; }
        }
    </style>
</head>

<body>
    <video autoplay muted loop id="myVideo" preload="auto">
        <source src="mainBG.mp4" type="video/mp4">
    </video>

    <nav class="navbar navbar-dark p-3 shadow home-navbar">
        <div class="container text-uppercase d-flex align-items-center">
            <a class="navbar-brand font-bungee m-0 text-white" href="#">
                <i class="bi bi-grid-3x3-gap-fill text-warning me-2"></i>HOME DASHBOARD

            <div class="d-flex gap-2 ms-auto">

    <main class="home-shell">
        <section class="dashboard-panel text-center">
            <div class="welcome-kicker">

            </div>

            <h1 class="welcome-title">

            <div class="profile-wrap">

            <div class="row g-3 text-uppercase">

        </section>
    </main>

    <!-- MAINTENANCE REPORT MODAL -->
    <div class="modal fade" id="reportModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-5 border-dark rounded-0 shadow-lg">

                                    </optgroup>
                                    <optgroup label="Library">

                                    </optgroup>
                                    <optgroup label="Sport Facility">

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        if (typeof window.supabaseClient === 'undefined' && typeof supabaseClient !== 'undefined') {
            window.supabaseClient = supabaseClient;
        }

        const STATUS_PENDING = 'PENDING';

        const bgVideo = document.getElementById('myVideo');

        if (bgVideo) {
            const savedTime = localStorage.getItem('bgVideoTime');
            if (savedTime) bgVideo.currentTime = parseFloat(savedTime);

            bgVideo.addEventListener('loadeddata', function () {
                bgVideo.classList.add('loaded');
            });

            if (bgVideo.readyState >= 3) bgVideo.classList.add('loaded');

            setInterval(() => {
                localStorage.setItem('bgVideoTime', bgVideo.currentTime);
            }, 500);

            window.addEventListener('beforeunload', () => {
                localStorage.setItem('bgVideoTime', bgVideo.currentTime);
            });
        }

        let currentIdentity = {
            userId: '',
            username: 'USER',
            studentId: ''
        };

        // FUNGSI MEMUATKAN DATA USER & GAMBAR PROFIL
        async function loadCurrentIdentity() {
            let savedData = {};
            try {
                savedData = JSON.parse(localStorage.getItem('userAccount')) || {};
            } catch (e) {}

            function setAvatar(url, name) {
                const avatarImg = document.getElementById('userAvatar');
                if (!avatarImg) return;
                
                if (url) {
                    avatarImg.src = url;
                } else {
                    avatarImg.src = 'https://api.dicebear.com/7.x/pixel-art/svg?seed=' + encodeURIComponent(name || 'PLAYER');
                }
            }

            // 1. Papar terus daripada storan jika sudah ada
            if (savedData.customAvatar) {
                setAvatar(savedData.customAvatar, savedData.fullname || savedData.username);
            }

            // 2. Tarik terus dari Supabase Auth
            if (window.supabaseClient) {
                try {
                    const { data, error } = await window.supabaseClient.auth.getUser();

                    if (!error && data && data.user) {
                        const user = data.user;
                        const meta = user.user_metadata || {};

                        currentIdentity = {
                            userId: user.id || '',
                            username:
                                meta.fullname ||
                                meta.full_name ||
                                meta.display_name ||
                                meta.username ||
                                user.email ||
                                'USER',
                            studentId:
                                meta.student_id ||
                                meta.studentId ||
                                meta.ic ||
                                meta.ic_number ||
                                user.id ||
                                ''
                        };

                        if (meta.custom_avatar) {
                            savedData.customAvatar = meta.custom_avatar;
                            localStorage.setItem('userAccount', JSON.stringify(savedData));
                            setAvatar(meta.custom_avatar, currentIdentity.username);
                        } else if (!savedData.customAvatar) {
                            setAvatar(null, currentIdentity.username);
                        }
                    }
                } catch (e) {
                    console.warn('Ralat auth getUser:', e);
                }
            }

            if (!currentIdentity.username || currentIdentity.username === 'USER') {
                currentIdentity.username = savedData.fullname || savedData.username || 'PLAYER';
            }

            const userDispEl = document.getElementById('userDisp');
            if (userDispEl) userDispEl.innerText = currentIdentity.username;

            // 3. Kunci semula selepas 300ms untuk kekalkan gambar profil
            setTimeout(() => {
                if (savedData.customAvatar) {
                    setAvatar(savedData.customAvatar, currentIdentity.username);
                }
            }, 300);

            return currentIdentity;
        }

        async function updateCheckInStatus() {
            const statusElement = document.getElementById('checkInStatus');
            const boxElement = document.getElementById('checkInBox');
            const identity = await loadCurrentIdentity();

            function showNoPending() {
                if (!statusElement) return;
                statusElement.innerHTML = '<i class="bi bi-check-circle-fill"></i> NO PENDING';
                statusElement.style.color = '#198754';
                if (boxElement) boxElement.classList.remove('animate-pulse', 'pending-active');
            }

            if (!window.supabaseClient || !identity.username) {
                showNoPending();
                return;
            }

            const { data, error } = await window.supabaseClient
                .from('bookings')
                .select('id')
                .eq('booked_by', identity.username)
                .eq('status', STATUS_PENDING);

            if (error) {
                console.error('Gagal fetch status booking:', error);
                showNoPending();
                return;
            }

            if (data && data.length > 0) {
                statusElement.innerHTML =
                    `<i class="bi bi-exclamation-triangle-fill"></i> ${data.length} ROOM WAITING`;
                statusElement.style.color = '#ff8f00';
                if (boxElement) boxElement.classList.add('animate-pulse', 'pending-active');
            } else {
                showNoPending();
            }
        }

        (function () {
            'use strict';

            const MAX_FILES = 5;
            const MAX_SIZE = 10 * 1024 * 1024;
            const ALLOWED = ['image/jpeg', 'image/png', 'image/jpg'];
            const LAST_SUBMIT_KEY = 'mr_last_submit_ts';

            const $ = id => document.getElementById(id);
            let selectedFiles = [];

            async function autofill() {
                const identity = await loadCurrentIdentity();
                let booking = null;

                if (window.supabaseClient && identity.username) {
                    const { data, error } = await window.supabaseClient
                        .from('bookings')
                        .select('id, room_name, booking_date, start_time, end_time, status, booked_by')
                        .eq('booked_by', identity.username)
                        .in('status', ['PENDING', 'CHECKED_IN'])
                        .gte('booking_date', new Date().toISOString().slice(0, 10))
                        .order('booking_date', { ascending: true })
                        .order('start_time', { ascending: true })
                        .limit(1)
                        .maybeSingle();

                    if (!error) booking = data;
                }

                if ($('mrRoom')) $('mrRoom').value = booking?.room_name || '';

                if ($('mrForm')) {
                    $('mrForm').dataset.bookingId = booking?.id ? String(booking.id) : '';
                }
            }

            function wireSeverity() {
                document.querySelectorAll('.mr-radio').forEach(label => {
                    label.addEventListener('click', () => {
                        document.querySelectorAll('.mr-radio').forEach(l => l.classList.remove('selected'));
                        label.classList.add('selected');
                        const input = label.querySelector('input');
                        if (input) input.checked = true;
                    });
                });
            }

            function wireDesc() {
                const desc = $('mrDesc');
                const count = $('mrDescCount');

                if (desc && count) {
                    desc.addEventListener('input', () => {
                        count.textContent = desc.value.length;
                    });
                }
            }

            function wireFiles() {
                const input = $('mrFiles');
                const pickBtn = $('mrPickBtn');

                if (!pickBtn || !input) return;

                pickBtn.addEventListener('click', () => input.click());

                input.addEventListener('change', e => {
                    const files = Array.from(e.target.files || []);

                    for (const f of files) {
                        if (selectedFiles.length >= MAX_FILES) {
                            alert('Maximum ' + MAX_FILES + ' images.');
                            break;
                        }
                        if (!ALLOWED.includes(f.type)) {
                            alert('Only JPG/PNG allowed: ' + f.name);
                            continue;
                        }
                        if (f.size > MAX_SIZE) {
                            alert('Max 10MB: ' + f.name);
                            continue;
                        }
                        selectedFiles.push(f);
                    }

                    input.value = '';
                    renderPreviews();
                });
            }

            function openLightbox(url) {
                const lb = $('mrLightbox');
                const img = $('mrLightboxImg');
                if (!lb || !img) return;
                img.src = url;
                lb.classList.add('open');
            }

            function closeLightbox() {
                $('mrLightbox')?.classList.remove('open');
            }

            function wireLightbox() {
                const lb = $('mrLightbox');
                const closeBtn = $('mrLightboxClose');

                closeBtn?.addEventListener('click', e => {
                    e.preventDefault();
                    e.stopPropagation();
                    closeLightbox();
                });

                lb?.addEventListener('click', e => {
                    if (e.target.id === 'mrLightbox') {
                        e.preventDefault();
                        e.stopPropagation();
                        closeLightbox();
                    }
                });

                document.addEventListener('keydown', e => {
                    if (e.key === 'Escape' && lb?.classList.contains('open')) {
                        e.preventDefault();
                        e.stopImmediatePropagation();
                        closeLightbox();
                    }
                }, true);
            }

            function renderPreviews() {
                const wrap = $('mrPreviews');
                if (!wrap) return;

                wrap.innerHTML = '';

                selectedFiles.forEach((f, i) => {
                    const url = URL.createObjectURL(f);
                    const div = document.createElement('div');
                    div.className = 'mr-thumb';
                    div.innerHTML = `<img src="${url}" alt=""><button type="button">×</button>`;

                    div.querySelector('img').onclick = () => openLightbox(url);
                    div.querySelector('button').onclick = e => {
                        e.stopPropagation();
                        selectedFiles.splice(i, 1);
                        renderPreviews();
                    };

                    wrap.appendChild(div);
                });
            }

            function modal({ title, body, buttons, success }) {
                const back = document.createElement('div');
                back.className = 'mr-modal-backdrop';

                back.innerHTML = `
                    <div class="mr-modal" role="dialog" aria-modal="true">
                        <div class="mr-modal-head ${success ? 'success' : ''}">${title}</div>
                        <div class="mr-modal-body">${body}</div>
                        <div class="mr-modal-foot"></div>
                    </div>`;

                const foot = back.querySelector('.mr-modal-foot');

                buttons.forEach(b => {
                    const btn = document.createElement('button');
                    btn.className = 'btn btn-roblox ' + (b.variant || 'btn-light');
                    if (b.variant?.includes('success')) btn.classList.add('text-white');
                    btn.textContent = b.label;
                    btn.onclick = () => {
                        b.onClick?.();
                        back.remove();
                    };
                    foot.appendChild(btn);
                });

                document.body.appendChild(back);
                return back;
            }

            function validate() {
                const errors = [];

                if (!$('mrRoom')?.value.trim()) errors.push('Please select a room / facility.');
                if (!$('mrCategory')?.value) errors.push('Select an issue category.');
                if (!document.querySelector('input[name="severity"]:checked')) errors.push('Select severity.');

                const desc = $('mrDesc')?.value.trim() || '';
                if (desc.length < 20) errors.push('Description must be at least 20 characters.');

                return errors;
            }

            async function uploadImages(refId) {
                if (!window.supabaseClient || !selectedFiles.length) return [];

                const urls = [];

                for (const f of selectedFiles) {
                    const path =
                        `${refId}/${Date.now()}-${f.name.replace(/[^a-zA-Z0-9._-]/g, '_')}`;

                    try {
                        const { error } = await window.supabaseClient.storage
                            .from('maintenance-images')
                            .upload(path, f);

                        if (!error) {
                            const { data } = window.supabaseClient.storage
                                .from('maintenance-images')
                                .getPublicUrl(path);

                            urls.push(data.publicUrl);
                        }
                    } catch (e) {
                        console.warn('Upload failed', e);
                    }
                }

                return urls;
            }

            async function submitReport() {
                const refId = 'MR-' + Date.now().toString().slice(-6);
                const linkedBookingId = $('mrForm')?.dataset.bookingId || null;
                const identity = await loadCurrentIdentity();

                const payload = {
                    reference_id: refId,
                    booking_id: linkedBookingId,
                    student_id: identity.studentId || identity.userId || '',
                    student_name: identity.username || 'USER',
                    room: $('mrRoom')?.value || '',
                    category: $('mrCategory')?.value || '',
                    severity: document.querySelector('input[name="severity"]:checked')?.value || 'Low',
                    description: $('mrDesc')?.value.trim() || '',
                    image_urls: [],
                    report_time: new Date().toISOString(),
                    status: STATUS_PENDING,
                    admin_note: null
                };

                try {
                    payload.image_urls = await uploadImages(refId);

                    if (window.supabaseClient) {
                        const { error } = await window.supabaseClient
                            .from('maintenance_reports')
                            .insert(payload);

                        if (error) throw error;
                    }
                } catch (e) {
                    console.error('Submit error', e);
                    alert('Report gagal dihantar: ' + (e.message || e));
                    return;
                }

                localStorage.setItem(LAST_SUBMIT_KEY, Date.now().toString());
                showSuccess();
            }

            function showSuccess() {
                modal({
                    success: true,
                    title: 'REPORT SUBMITTED',
                    body: `<div class="mr-icon"><i class="bi bi-check-circle-fill"></i></div>
                           <h5 class="font-bungee mb-2">Report Submitted Successfully</h5>
                           <p class="mb-0 small">Thank you. Your maintenance report has been sent to the administrator.</p>`,
                    buttons: [{
                        label: 'OK',
                        variant: 'btn-success',
                        onClick: () => {
                            bootstrap.Modal.getInstance(
                                document.getElementById('reportModal')
                            )?.hide();
                        }
                    }]
                });
            }

            function confirmSubmit() {
                modal({
                    title: 'SUBMIT MAINTENANCE REPORT?',
                    body: `<p class="mb-0">Are you sure you want to submit this maintenance report?<br>
                           <small class="text-muted">You cannot edit it after submission.</small></p>`,
                    buttons: [
                        { label: 'CANCEL', variant: 'btn-light' },
                        { label: 'SUBMIT', variant: 'btn-success', onClick: submitReport }
                    ]
                });
            }

            function wireForm() {
                $('mrCancel')?.addEventListener('click', e => {
                    e.preventDefault();
                    bootstrap.Modal.getInstance(
                        document.getElementById('reportModal')
                    )?.hide();
                });

                $('mrForm')?.addEventListener('submit', e => {
                    e.preventDefault();

                    const errs = validate();

                    if (errs.length) {
                        alert(errs.join('\n'));
                        return;
                    }

                    const last = parseInt(
                        localStorage.getItem(LAST_SUBMIT_KEY) || '0',
                        10
                    );

                    if (last && Date.now() - last < 5 * 60 * 1000) {
                        alert('Please wait before submitting another report (5-minute cooldown).');
                        return;
                    }

                    confirmSubmit();
                });
            }

            document.addEventListener('DOMContentLoaded', async () => {
                await loadCurrentIdentity();
                await updateCheckInStatus();
                await autofill();

                wireSeverity();
                wireDesc();
                wireFiles();
                wireForm();
                wireLightbox();
            });
        })();

        (function () {
            if (window.__faqChatbotLoaderBound) return;
            window.__faqChatbotLoaderBound = true;

            const candidates = [
                './faq-chatbot.js',
                '../faq-chatbot.js',
                '../../faq-chatbot.js',
                '../../../faq-chatbot.js'
            ];

            let index = 0;

            function tryLoad() {
                if (index >= candidates.length) return;

                const script = document.createElement('script');
                script.src = candidates[index];

                script.onload = function () {
                    if (window.__rbxFaqLoaded) {
                        console.log('FAQ chatbot loaded');
                    }
                };

                script.onerror = function () {
                    index += 1;
                    tryLoad();
                };

                document.head.appendChild(script);
            }

            tryLoad();
        })();
    </script>
</body>
</html>
