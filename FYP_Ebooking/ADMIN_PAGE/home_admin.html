    <div class="container mt-5 mb-5">
        <div class="welcome-banner p-4 shadow-sm">

            <h3 class="font-bungee text-dark mb-4 text-center text-md-start">
                <i class="bi bi-graph-up-arrow text-primary"></i>
                MONTHLY USAGE ANALYSIS
            </h3>

            <div id="chartContainer" style="height: 400px; width: 100%;">
                <canvas id="monthlyChart"></canvas>

                <div id="chartEmptyState">
                    <div>
                        <i class="bi bi-bar-chart fs-1 text-muted"></i>
                        <h5 class="font-bungee mt-3">NO BOOKING DATA</h5>
                        <p class="text-muted mb-0" id="emptyStateText"></p>
                    </div>
                </div>
            </div>

            <div class="mt-4 p-3 border-2 border-dark bg-light text-uppercase">
                <p class="small mb-0 fw-bold">
                    <i class="bi bi-info-circle-fill"></i>
                    Info: This chart shows the total room usage hours per month <span id="chartYear"></span>.
                </p>
            </div>

        </div>
    </div>

    <script>
        function hoursBetween(startStr, endStr) {
            if (!startStr || !endStr) return 0;

            const [sh, sm] = startStr.split(':').map(Number);
            const [eh, em] = endStr.split(':').map(Number);

            const startMinutes = (sh * 60) + sm;
            const endMinutes = (eh * 60) + em;
            const diff = endMinutes - startMinutes;

            return diff > 0 ? diff / 60 : 0;
        }

        async function loadMonthlyUsageChart() {
            const currentYear = new Date().getFullYear();
            document.getElementById('chartYear').textContent = currentYear;

            // JUL, AUG, SEP, OCT, NOV, DEC
            let monthlyHours = [0, 0, 0, 0, 0, 0];

            const canvas = document.getElementById('monthlyChart');
            const emptyState = document.getElementById('chartEmptyState');
            const emptyStateText = document.getElementById('emptyStateText');

            if (!window.supabaseClient) {
                canvas.style.display = 'none';
                emptyState.style.display = 'flex';
                emptyStateText.textContent = 'Supabase tidak dapat disambungkan.';
                return;
            }

            const { data, error } = await window.supabaseClient
                .from('bookings')
                .select('booking_date, start_time, end_time, status')
                .gte('booking_date', `${currentYear}-07-01`)
                .lte('booking_date', `${currentYear}-12-31`);

            if (error) {
                console.error('Gagal load data booking untuk graf:', error);

                canvas.style.display = 'none';
                emptyState.style.display = 'flex';
                emptyStateText.textContent = 'Data booking gagal dimuatkan.';
                return;
            }

            (data || []).forEach(booking => {
                // Booking CANCELLED tak dikira sebagai penggunaan.
                if ((booking.status || '').toLowerCase() === 'cancelled') {
                    return;
                }

                const monthIndex = new Date(
                    booking.booking_date + 'T00:00:00'
                ).getMonth();

                // JavaScript:
                // Jul = 6 ... Dec = 11
                if (monthIndex < 6 || monthIndex > 11) {
                    return;
                }

                // Jul -> index 0, Aug -> 1, ... Dec -> 5
                const chartIndex = monthIndex - 6;

                monthlyHours[chartIndex] += hoursBetween(
                    booking.start_time,
                    booking.end_time
                );
            });

            monthlyHours = monthlyHours.map(
                hours => Math.round(hours * 10) / 10
            );

            const hasData = monthlyHours.some(hours => hours > 0);

            if (!hasData) {
                canvas.style.display = 'none';
                emptyState.style.display = 'flex';
                emptyStateText.textContent =
                    `Belum ada penggunaan bilik direkodkan dari Julai hingga Disember ${currentYear}.`;
                return;
            }

            emptyState.style.display = 'none';
            canvas.style.display = 'block';

            const ctx = canvas.getContext('2d');

            new Chart(ctx, {
                type: 'bar',

                data: {
                    labels: [
                        'JUL',
                        'OGOS',
                        'SEP',
                        'OKT',
                        'NOV',
                        'DIS'
                    ],

                    datasets: [{
                        label: 'TOTAL BOOKING HOURS',

                        data: monthlyHours,

                        backgroundColor: [
                            '#00A2FF',
                            '#E2231A',
                            '#00E223',
                            '#fbc02d',
                            '#9c27b0',
                            '#ff8f00'
                        ],

                        borderColor: '#393B3D',
                        borderWidth: 3,
                        borderRadius: 10
                    }]
                },

                options: {
                    responsive: true,
                    maintainAspectRatio: false,

                    scales: {
                        y: {
                            beginAtZero: true,

                            title: {
                                display: true,
                                text: 'JAM'
                            },

                            ticks: {
                                precision: 1,
                                font: {
                                    family: 'Poppins',
                                    weight: 'bold'
                                }
                            }
                        },

                        x: {
                            ticks: {
                                font: {
                                    family: 'Bungee',
                                    size: 10
                                }
                            }
                        }
                    },

                    plugins: {
                        legend: {
                            display: false
                        },

                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    return `${context.raw} jam`;
                                }
                            }
                        }
                    }
                }
            });
        }

        document.addEventListener(
            'DOMContentLoaded',
            loadMonthlyUsageChart
        );
    </script>

    <script data-faq-loader="true">
        (function () {
            if (window.__faqChatbotLoaderBound) return;
            window.__faqChatbotLoaderBound = true;

            var candidates = [
                './faq-chatbot.js',
                '../faq-chatbot.js',
                '../../faq-chatbot.js',
                '../../../faq-chatbot.js'
            ];

            var index = 0;

            function tryLoad() {
                if (index >= candidates.length) return;

                var script = document.createElement('script');
                script.src = candidates[index];

                script.onload = function () {
                    if (window.__rbxFaqLoaded) {
                        console.log('FAQ chatbot loaded');
                    }
                };

                script.onerror = function () {
                    index += 1;
                    tryLoad();
                };

                document.head.appendChild(script);
            }

            tryLoad();
        })();
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
