<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>BOOKING PASS / RECEIPT</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Poppins:wght@400;700&display=swap" rel="stylesheet">
    <!-- QRCode.js for dynamic check-in QR -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <!-- Supabase JS (client only initialized if keys are wired up) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
:root {
    --bk-blue: #00A2FF;
    --bk-green: #00E223;
    --bk-red: #E2231A;
    --bk-yellow: #FFC800;
    --bk-dark: #393B3D;
    --bk-bg: #e9ecf1;
}
* { box-sizing: border-box; }
body {
    background: var(--bk-bg);
    font-family: 'Poppins', sans-serif;
    color: var(--bk-dark);
    margin: 0;
    padding: 0 0 40px;
}

/* ---------- Navbar ---------- */
.br-nav {
    background: var(--bk-dark);
    color: #fff;
    padding: 12px 20px;
    display: flex; align-items: center; justify-content: space-between;
    border-bottom: 5px solid #000;
    font-family: 'Bungee', cursive;
}
.br-nav .brand { font-size: 1rem; letter-spacing: 1px; display: flex; align-items: center; gap: 8px; }
.br-nav .brand i { color: var(--bk-yellow); }

.br-wrap { max-width: 720px; margin: 30px auto 0; padding: 0 16px; }

/* ---------- Roblox buttons ---------- */
.btn-rbx {
    font-family: 'Bungee', cursive;
    font-size: .72rem;
    letter-spacing: .5px;
    border: 4px solid var(--bk-dark);
    border-radius: 0;
    padding: 12px 16px;
    color: #fff;
    background: var(--bk-blue);
    box-shadow: 5px 5px 0 var(--bk-dark);
    cursor: pointer;
    transition: transform .1s, box-shadow .1s;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    text-decoration: none;
}
.btn-rbx:hover { transform: translate(-2px,-2px); box-shadow: 7px 7px 0 var(--bk-dark); color: #fff; }
.btn-rbx:active { transform: translate(2px,2px); box-shadow: 2px 2px 0 var(--bk-dark); }
.btn-rbx.green { background: var(--bk-green); color: #06340d; }
.btn-rbx.yellow { background: var(--bk-yellow); color: #4a3800; }
.btn-rbx.dark { background: var(--bk-dark); }
.btn-rbx.red { background: var(--bk-red); }

/* ---------- The Pass / Ticket ---------- */
.pass {
    background: #fff;
    border: 5px solid var(--bk-dark);
    box-shadow: 10px 10px 0 rgba(0,0,0,.4);
}
.pass-head {
    background: var(--bk-blue);
    color: #fff;
    padding: 20px 22px;
    border-bottom: 5px solid var(--bk-dark);
    text-align: center;
    position: relative;
}
.pass-head h1 {
    font-family: 'Bungee', cursive;
    font-size: 1.35rem;
    margin: 0;
    text-shadow: 2px 2px 0 rgba(0,0,0,.35);
    letter-spacing: 1px;
}
.pass-head .sub { font-size: .8rem; opacity: .95; margin-top: 4px; }

.status-badge {
    display: inline-block;
    font-family: 'Bungee', cursive;
    font-size: .75rem;
    padding: 8px 18px;
    border: 4px solid var(--bk-dark);
    box-shadow: 4px 4px 0 rgba(0,0,0,.4);
    margin-top: 14px;
    letter-spacing: 1px;
}
.status-badge.pending { background: var(--bk-yellow); color: #4a3800; }
.status-badge.approved { background: var(--bk-green); color: #06340d; }
.status-badge.rejected { background: var(--bk-red); color: #fff; }
.status-badge.cancelled { background: var(--bk-dark); color: #fff; }

/* perforation divider */
.perf {
    height: 0;
    border-top: 4px dashed var(--bk-dark);
    position: relative;
    margin: 0;
}
.perf::before, .perf::after {
    content: "";
    position: absolute;
    top: -18px;
    width: 32px; height: 32px;
    background: var(--bk-bg);
    border: 4px solid var(--bk-dark);
    border-radius: 50%;
}
.perf::before { left: -20px; }
.perf::after { right: -20px; }

.pass-body { padding: 24px 22px; }

/* detail grid */
.pass-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
}
.pass-grid .full { grid-column: 1 / -1; }
.field {
    border: 3px solid var(--bk-dark);
    box-shadow: 4px 4px 0 rgba(0,0,0,.18);
    padding: 10px 12px;
    background: #f7f9fc;
}
.field .k {
    font-family: 'Bungee', cursive;
    font-size: .58rem;
    letter-spacing: .5px;
    color: var(--bk-dark);
    display: block;
    margin-bottom: 4px;
    opacity: .8;
}
.field .v {
    font-family: 'Poppins', sans-serif;
    font-weight: 700;
    font-size: .95rem;
    word-break: break-word;
}
.field .v.ref { font-family: 'Bungee', cursive; color: var(--bk-blue); letter-spacing: 1px; }

/* QR section */
.qr-box {
    text-align: center;
    margin-top: 22px;
    padding: 20px;
    border: 4px dashed var(--bk-dark);
    background: #fff;
}
.qr-box .qr-title {
    font-family: 'Bungee', cursive;
    font-size: .8rem;
    margin-bottom: 12px;
    letter-spacing: .5px;
}
#qrcode {
    display: inline-block;
    padding: 12px;
    border: 4px solid var(--bk-dark);
    background: #fff;
    box-shadow: 5px 5px 0 rgba(0,0,0,.3);
}
#qrcode img, #qrcode canvas { display: block; }
.qr-box .qr-hint { font-size: .72rem; color: #666; margin-top: 12px; }

/* actions */
.pass-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    padding: 0 22px 24px;
}
.pass-actions .btn-rbx { flex: 1; min-width: 160px; }

.load-note { text-align:center; font-family:'Bungee',cursive; color:#888; padding:40px; }

/* ---------- Print (A4 Pass) ---------- */
@media print {
    body { background: #fff; padding: 0; }
    .br-nav, .pass-actions, .no-print { display: none !important; }
    .br-wrap { margin: 0; max-width: 100%; padding: 0; }
    .pass {
        box-shadow: none;
        border: 3px solid #000;
        page-break-inside: avoid;
    }
    .pass-head { background: #fff !important; color: #000 !important; border-bottom: 3px solid #000; }
    .pass-head h1 { text-shadow: none; }
    .status-badge { box-shadow: none; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .field { box-shadow: none; background: #fff; }
    #qrcode { box-shadow: none; }
    @page { size: A4; margin: 14mm; }
}

@media (max-width: 560px) {
    .pass-grid { grid-template-columns: 1fr; }
    .pass-head h1 { font-size: 1.1rem; }
}
    </style>
</head>
<body>
    <nav class="br-nav no-print">
        <div class="brand"><i class="bi bi-ticket-perforated-fill"></i> E-BOOKING SYSTEM</div>
        <a href="user_dashboard.html" class="btn-rbx dark" style="box-shadow:3px 3px 0 #000;padding:8px 12px;font-size:.6rem;">
            <i class="bi bi-grid-fill"></i> DASHBOARD
        </a>
    </nav>

    <div class="br-wrap">
        <div id="passContainer">
            <div class="load-note"><i class="bi bi-hourglass-split"></i> LOADING PASS…</div>
        </div>
    </div>

    <script>
    /* =========================================================
       CONFIG — Supabase (optional). Fill these in to go live.
       If left blank, the page falls back to mock/local data.
    ========================================================= */
    const SUPABASE_URL = ""; // e.g. "https://xxxx.supabase.co"
    const SUPABASE_ANON_KEY = "";
    let supabaseClient = null;
    if (SUPABASE_URL && SUPABASE_ANON_KEY && window.supabase) {
        supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    }

    /* ---------- Helpers ---------- */
    function getParam(name) {
        return new URLSearchParams(window.location.search).get(name);
    }
    function esc(s) {
        return String(s ?? "").replace(/[&<>"']/g, m => (
            { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]
        ));
    }
    function formatDate(d) {
        if (!d) return "—";
        try {
            const dt = new Date(d);
            if (isNaN(dt)) return d;
            return dt.toLocaleDateString("en-GB", { weekday: "short", day: "2-digit", month: "short", year: "numeric" });
        } catch { return d; }
    }

    /* ---------- Mock fallback booking ---------- */
    function mockBooking(ref) {
        return {
            reference: ref || "BK-99812",
            facility: "Lecture Hall A",
            room: "Lecture Hall A",
            date: new Date().toISOString().slice(0, 10),
            time_slot: "10:00 - 11:00",
            applicant_name: "Muhammad Harith Fahmi",
            student_id: "S00000",
            purpose: "Group discussion & project presentation rehearsal",
            status: "PENDING"
        };
    }

    /* ---------- Data source: URL -> localStorage -> Supabase -> mock ---------- */
    async function loadBooking() {
        let ref = getParam("ref");

        // Fallback to localStorage if URL param missing
        if (!ref) {
            ref = localStorage.getItem("last_booking_ref");
        }

        // Try Supabase if configured
        if (supabaseClient && ref) {
            try {
                const { data, error } = await supabaseClient
                    .from("bookings")
                    .select("*")
                    .eq("reference", ref)
                    .single();
                if (!error && data) return normalize(data);
            } catch (e) {
                console.warn("[v0] Supabase fetch failed, using fallback", e);
            }
        }

        // Try a stored booking object saved by the booking engine
        try {
            const cached = JSON.parse(localStorage.getItem("booking_" + ref) || "null");
            if (cached) return normalize(cached);
        } catch { /* ignore */ }

        // Final fallback: mock
        return normalize(mockBooking(ref));
    }

    function normalize(b) {
        return {
            reference: b.reference || b.ref || "BK-00000",
            room: b.room || b.facility || b.facility_name || "N/A",
            date: b.date || b.booking_date || "",
            time_slot: b.time_slot || b.timeSlot || (b.start_time && b.end_time ? `${b.start_time} - ${b.end_time}` : "—"),
            applicant_name: b.applicant_name || b.name || b.full_name || "N/A",
            student_id: b.student_id || b.studentId || "N/A",
            purpose: b.purpose || "—",
            status: (b.status || "PENDING").toUpperCase()
        };
    }

    /* ---------- Render ---------- */
    function render(b) {
        const statusClass = {
            PENDING: "pending", APPROVED: "approved",
            REJECTED: "rejected", CANCELLED: "cancelled"
        }[b.status] || "pending";

        const maintenanceUrl = "maintenance_report.html?ref=" + encodeURIComponent(b.reference) +
            "&room=" + encodeURIComponent(b.room) +
            "&name=" + encodeURIComponent(b.applicant_name) +
            "&studentId=" + encodeURIComponent(b.student_id);

        document.getElementById("passContainer").innerHTML = `
            <div class="pass" id="passCard">
                <div class="pass-head">
                    <h1>BOOKING PASS / RECEIPT</h1>
                    <div class="sub">Institutional E-Booking &amp; Facility Management</div>
                    <div><span class="status-badge ${statusClass}">${esc(b.status)}</span></div>
                </div>
                <div class="perf"></div>
                <div class="pass-body">
                    <div class="pass-grid">
                        <div class="field full">
                            <span class="k">Reference ID</span>
                            <span class="v ref">${esc(b.reference)}</span>
                        </div>
                        <div class="field">
                            <span class="k">Room / Facility</span>
                            <span class="v">${esc(b.room)}</span>
                        </div>
                        <div class="field">
                            <span class="k">Date</span>
                            <span class="v">${esc(formatDate(b.date))}</span>
                        </div>
                        <div class="field">
                            <span class="k">Time Slot</span>
                            <span class="v">${esc(b.time_slot)}</span>
                        </div>
                        <div class="field">
                            <span class="k">Student ID</span>
                            <span class="v">${esc(b.student_id)}</span>
                        </div>
                        <div class="field full">
                            <span class="k">Applicant Name</span>
                            <span class="v">${esc(b.applicant_name)}</span>
                        </div>
                        <div class="field full">
                            <span class="k">Purpose</span>
                            <span class="v">${esc(b.purpose)}</span>
                        </div>
                    </div>

                    <div class="qr-box">
                        <div class="qr-title"><i class="bi bi-qr-code"></i> CHECK-IN QR CODE</div>
                        <div id="qrcode"></div>
                        <div class="qr-hint">Scan at the facility to check in &mdash; encodes <b>${esc(b.reference)}</b></div>
                    </div>
                </div>
                <div class="pass-actions no-print">
                    <button class="btn-rbx green" onclick="window.print()">
                        <i class="bi bi-printer-fill"></i> PRINT / SAVE PDF
                    </button>
                    <a class="btn-rbx yellow" href="${maintenanceUrl}">
                        <i class="bi bi-tools"></i> REPORT ISSUE
                    </a>
                    <a class="btn-rbx dark" href="user_dashboard.html">
                        <i class="bi bi-house-fill"></i> DASHBOARD
                    </a>
                </div>
            </div>
        `;

        // Generate QR encoding the reference ID for check-in
        new QRCode(document.getElementById("qrcode"), {
            text: b.reference,
            width: 150,
            height: 150,
            colorDark: "#393B3D",
            colorLight: "#ffffff",
            correctLevel: QRCode.CorrectLevel.H
        });
    }

    /* ---------- Init ---------- */
    (async function init() {
        const booking = await loadBooking();
        render(booking);
    })();
    </script>
</body>
</html>
