<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FACILITY BOOKING</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Poppins:wght@400;700&display=swap" rel="stylesheet">

    <!-- Shared design-system stubs (matches maintenance_report) -->
    <style>
        .font-bungee { font-family: 'Bungee', cursive; }
        .btn-roblox { border-radius: 0; box-shadow: 3px 3px 0 rgba(0,0,0,.3); }
        .navbar { background-color: #393B3D !important; }
        body { background: #e9ecf1; }
    </style>

    <!-- booking.css (inline for preview) — same Roblox design language -->
    <style>
:root {
    --bk-blue: #00A2FF;
    --bk-green: #00E223;
    --bk-red: #E2231A;
    --bk-yellow: #FFC800;
    --bk-dark: #393B3D;
}

.bk-wrap { max-width: 1100px; margin: 0 auto; }

/* ---------- Page header ---------- */
.bk-header {
    background: var(--bk-blue);
    color: #fff;
    padding: 20px 22px;
    border: 5px solid var(--bk-dark);
    box-shadow: 10px 10px 0 rgba(0,0,0,.5);
    font-family: 'Bungee', cursive;
    text-align: center;
    margin-bottom: 26px;
}
.bk-header p { font-family: 'Poppins', sans-serif; opacity: .95; }

/* ---------- Quota strip ---------- */
.bk-quota {
    display: flex; flex-wrap: wrap; gap: 12px;
    margin-bottom: 22px;
}
.bk-quota .q-item {
    flex: 1; min-width: 150px;
    background: #fff;
    border: 4px solid var(--bk-dark);
    box-shadow: 5px 5px 0 rgba(0,0,0,.35);
    padding: 12px 14px;
}
.bk-quota .q-label {
    font-family: 'Bungee', cursive; font-size: .68rem;
    color: var(--bk-dark); letter-spacing: .5px; display: block;
}
.bk-quota .q-value { font-family: 'Bungee', cursive; font-size: 1.5rem; }
.bk-quota .q-value.ok { color: var(--bk-green); }
.bk-quota .q-value.warn { color: var(--bk-red); }
.bk-quota .q-sub { font-size: .72rem; color: #666; }

/* ---------- Filter bar ---------- */
.bk-filters {
    background: #fff;
    border: 4px solid var(--bk-dark);
    box-shadow: 6px 6px 0 rgba(0,0,0,.35);
    padding: 16px;
    margin-bottom: 26px;
}
.bk-input {
    border: 3px solid var(--bk-dark) !important;
    border-radius: 0 !important;
    padding: 9px !important;
    font-family: 'Poppins', sans-serif;
    box-shadow: 3px 3px 0 rgba(0,0,0,.15);
    background: #fff;
}
.bk-input:focus {
    border-color: var(--bk-blue) !important;
    box-shadow: 0 0 0 4px rgba(0,162,255,.25) !important;
    outline: none;
}
.bk-mini-label {
    display: block; font-family: 'Bungee', cursive;
    font-size: .66rem; color: var(--bk-dark);
    margin-bottom: 5px; letter-spacing: .5px;
}

/* ---------- Facility grid ---------- */
.bk-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 20px;
    margin-bottom: 30px;
}
.bk-card {
    background: #fff;
    border: 4px solid var(--bk-dark);
    box-shadow: 7px 7px 0 rgba(0,0,0,.4);
    display: flex; flex-direction: column;
    transition: transform .12s, box-shadow .12s;
    overflow: hidden;
}
.bk-card:hover { transform: translate(-2px,-2px); box-shadow: 9px 9px 0 rgba(0,0,0,.45); }
.bk-card .c-top {
    padding: 8px 12px;
    font-family: 'Bungee', cursive; font-size: .62rem;
    color: #fff; letter-spacing: .5px;
    display: flex; justify-content: space-between; align-items: center;
}
.c-top.type-lab { background: #7a4bd8; }        /* purple only as a small tag accent */
.c-top.type-classroom { background: var(--bk-blue); }
.c-top.type-hall { background: var(--bk-dark); }
.c-top.type-equipment { background: #d87a2b; }
.bk-card .c-body { padding: 14px; flex: 1; }
.bk-card h3 { font-family: 'Bungee', cursive; font-size: 1rem; margin: 0 0 6px; }
.bk-meta { font-size: .82rem; color: #444; margin-bottom: 4px; }
.bk-meta i { color: var(--bk-dark); width: 18px; }
.bk-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.bk-tag {
    font-size: .68rem; background: #eef4fb; border: 2px solid var(--bk-dark);
    padding: 2px 7px; font-family: 'Poppins', sans-serif;
}
.bk-status {
    font-family: 'Bungee', cursive; font-size: .58rem;
    padding: 3px 8px; border: 2px solid #fff;
}
.bk-status.available { background: var(--bk-green); color: #06340d; }
.bk-status.maintenance { background: var(--bk-yellow); color: #4a3800; }
.bk-status.disabled { background: var(--bk-red); color: #fff; }
.bk-card .c-foot { padding: 12px 14px; border-top: 3px dashed #cfcfcf; }
.bk-card .c-foot .btn { width: 100%; }

.bk-empty {
    grid-column: 1 / -1; text-align: center; padding: 40px;
    font-family: 'Bungee', cursive; color: #888;
}

/* ---------- Booking modal ---------- */
.bk-modal-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,.55);
    display: flex; align-items: flex-start; justify-content: center;
    z-index: 10000; padding: 24px 16px; overflow-y: auto;
}
.bk-modal {
    background: #fff; border: 5px solid var(--bk-dark);
    box-shadow: 10px 10px 0 rgba(0,0,0,.5);
    max-width: 620px; width: 100%;
    font-family: 'Poppins', sans-serif;
    margin: auto;
}
.bk-modal-head {
    background: var(--bk-blue); color: #fff;
    padding: 16px; border-bottom: 4px solid var(--bk-dark);
    font-family: 'Bungee', cursive;
    display: flex; justify-content: space-between; align-items: center;
}
.bk-modal-head.success { background: var(--bk-green); }
.bk-modal-head .x {
    background: none; border: none; color: #fff; font-size: 1.4rem;
    line-height: 1; cursor: pointer; padding: 0 4px;
}
.bk-modal-body { padding: 20px; }
.bk-modal-foot {
    display: flex; gap: 10px; justify-content: flex-end;
    padding: 14px 20px; border-top: 3px solid var(--bk-dark); background: #f5f5f5;
}

/* ---------- Time-slot grid (conflict detection visual) ---------- */
.bk-slots {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr));
    gap: 8px; margin-top: 6px;
}
.bk-slot {
    text-align: center; padding: 9px 4px;
    border: 3px solid var(--bk-dark);
    box-shadow: 3px 3px 0 rgba(0,0,0,.2);
    background: #fff; cursor: pointer;
    font-family: 'Poppins', sans-serif; font-size: .82rem; font-weight: 700;
    transition: .12s; user-select: none;
}
.bk-slot:hover:not(.booked) { transform: translate(-1px,-1px); }
.bk-slot.selected { background: var(--bk-blue); color: #fff; border-color: var(--bk-dark); }
.bk-slot.booked {
    background: repeating-linear-gradient(45deg,#f8d7da,#f8d7da 6px,#f1c2c6 6px,#f1c2c6 12px);
    color: #9a1c17; cursor: not-allowed; text-decoration: line-through;
}
.bk-legend { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 12px; font-size: .74rem; }
.bk-legend span { display: inline-flex; align-items: center; gap: 6px; }
.bk-legend .dot { width: 14px; height: 14px; border: 2px solid var(--bk-dark); display: inline-block; }
.dot.free { background: #fff; }
.dot.sel { background: var(--bk-blue); }
.dot.busy { background: #f1c2c6; }

.bk-summary {
    background: #eef4fb; border: 3px solid var(--bk-dark);
    padding: 12px; margin-top: 16px; font-size: .86rem;
}
.bk-summary b { font-family: 'Bungee', cursive; font-size: .72rem; }

.bk-icon-big { font-size: 3.5rem; color: var(--bk-green); }
.bk-ref-badge {
    font-family: 'Bungee', cursive; font-size: 1.3rem; color: var(--bk-dark);
    background: var(--bk-yellow); border: 3px solid var(--bk-dark);
    display: inline-block; padding: 6px 16px; margin: 10px 0;
    box-shadow: 4px 4px 0 rgba(0,0,0,.3);
}

/* ---------- My bookings ---------- */
.bk-section-title {
    font-family: 'Bungee', cursive; font-size: 1.1rem; color: var(--bk-dark);
    border-bottom: 4px solid var(--bk-dark); padding-bottom: 6px; margin-bottom: 16px;
}
.bk-booking-row {
    background: #fff; border: 3px solid var(--bk-dark);
    box-shadow: 5px 5px 0 rgba(0,0,0,.3);
    padding: 12px 14px; margin-bottom: 12px;
    display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between;
}
.bk-booking-row .b-ref { font-family: 'Bungee', cursive; font-size: .8rem; }
.bk-pill {
    font-family: 'Bungee', cursive; font-size: .58rem;
    padding: 3px 9px; border: 2px solid var(--bk-dark);
}
.bk-pill.PENDING { background: var(--bk-yellow); }
.bk-pill.APPROVED { background: var(--bk-green); color:#06340d; }
.bk-pill.REJECTED { background: var(--bk-red); color:#fff; }

@media (max-width: 575.98px) {
    .bk-header { border-width: 4px; box-shadow: 6px 6px 0 rgba(0,0,0,.5); }
    .bk-modal-foot { flex-direction: column-reverse; }
    .bk-modal-foot .btn { width: 100%; }
}
    </style>
</head>
<body>
    <nav class="navbar navbar-dark p-3 shadow">
        <div class="container text-uppercase">
            <a class="navbar-brand font-bungee text-white" href="#"><i class="bi bi-calendar-check"></i> FACILITY BOOKING</a>
            <div class="d-flex gap-2 align-items-center">
                <span class="text-white small d-none d-md-inline" id="navUser"></span>
                <button class="btn btn-primary btn-sm font-bungee border-2 border-white">BACK TO LOBBY</button>
            </div>
        </div>
    </nav>

    <div class="container py-4">
        <div class="bk-wrap">

            <div class="bk-header rbx-in">
                <h1 class="font-bungee mb-1">BOOK A FACILITY</h1>
                <p class="mb-0 small">Browse available rooms &amp; equipment, pick a free time slot, and reserve. Conflicts are blocked automatically.</p>
            </div>

            <!-- QUOTA STRIP -->
            <div class="bk-quota">
                <div class="q-item">
                    <span class="q-label">Active Bookings</span>
                    <span class="q-value ok" id="qActive">0 / 3</span>
                    <span class="q-sub">Max concurrent reservations</span>
                </div>
                <div class="q-item">
                    <span class="q-label">Weekly Hours</span>
                    <span class="q-value ok" id="qHours">0 / 12</span>
                    <span class="q-sub">Resets every Monday</span>
                </div>
                <div class="q-item">
                    <span class="q-label">Role</span>
                    <span class="q-value" style="color:var(--bk-blue)" id="qRole">STUDENT</span>
                    <span class="q-sub">Bookings require approval</span>
                </div>
            </div>

            <!-- FILTERS -->
            <div class="bk-filters">
                <div class="row g-3 align-items-end">
                    <div class="col-md-5">
                        <label class="bk-mini-label" for="fSearch">Search</label>
                        <input type="text" id="fSearch" class="form-control bk-input" placeholder="Room name or location...">
                    </div>
                    <div class="col-md-3">
                        <label class="bk-mini-label" for="fType">Type</label>
                        <select id="fType" class="form-select bk-input">
                            <option value="">All types</option>
                            <option value="classroom">Classroom</option>
                            <option value="lab">Lab</option>
                            <option value="hall">Hall</option>
                            <option value="equipment">Equipment</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <label class="bk-mini-label" for="fCap">Min Capacity</label>
                        <select id="fCap" class="form-select bk-input">
                            <option value="0">Any</option>
                            <option value="10">10+</option>
                            <option value="30">30+</option>
                            <option value="60">60+</option>
                            <option value="100">100+</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <label class="bk-mini-label">&nbsp;</label>
                        <button class="btn btn-roblox btn-light w-100" id="fReset"><i class="bi bi-arrow-counterclockwise"></i> RESET</button>
                    </div>
                </div>
            </div>

            <!-- FACILITY GRID -->
            <div class="bk-grid" id="grid"></div>

            <!-- MY BOOKINGS -->
            <h2 class="bk-section-title"><i class="bi bi-journal-bookmark-fill"></i> MY BOOKINGS</h2>
            <div id="myBookings"></div>
        </div>
    </div>

    <!-- booking.js (inline for preview) — vanilla JS, Supabase-ready, mock data -->
    <script>
(function () {
    'use strict';

    // ---------------------------------------------------------------
    // CONFIG / QUOTA RULES (mirrors SRS: quota management)
    // ---------------------------------------------------------------
    const MAX_ACTIVE = 3;
    const MAX_WEEK_HOURS = 12;
    const $ = (id) => document.getElementById(id);

    // ---------------------------------------------------------------
    // MOCK DATA — facilities catalog
    // (Later: SELECT * FROM facilities via Supabase)
    // ---------------------------------------------------------------
    const FACILITIES = [
        { id:'f1', name:'Lecture Hall A', type:'hall', location:'Block A, Level 1', capacity:120, status:'available', equipment:['Projector','PA System','AC'] },
        { id:'f2', name:'Computer Lab 3', type:'lab', location:'Block C, Level 2', capacity:40, status:'available', equipment:['40 PCs','Projector','AC'] },
        { id:'f3', name:'Tutorial Room 12', type:'classroom', location:'Block B, Level 1', capacity:25, status:'available', equipment:['Whiteboard','TV'] },
        { id:'f4', name:'Seminar Room 5', type:'classroom', location:'Block B, Level 3', capacity:30, status:'maintenance', equipment:['Projector','AC','Whiteboard'] },
        { id:'f5', name:'Physics Lab', type:'lab', location:'Block D, Level 1', capacity:35, status:'available', equipment:['Lab Benches','Fume Hood'] },
        { id:'f6', name:'Portable Projector Kit', type:'equipment', location:'AV Store, Block A', capacity:1, status:'available', equipment:['Projector','HDMI','Screen'] },
        { id:'f7', name:'Main Auditorium', type:'hall', location:'Block E, Ground', capacity:300, status:'disabled', equipment:['Stage','PA System','Lighting'] },
        { id:'f8', name:'Design Studio 2', type:'classroom', location:'Block F, Level 2', capacity:20, status:'available', equipment:['Drawing Tables','Projector'] }
    ];

    // Time slots (hourly, 8am–6pm)
    const SLOTS = ['08:00','09:00','10:00','11:00','12:00','13:00','14:00','15:00','16:00','17:00'];

    // ---------------------------------------------------------------
    // MOCK EXISTING BOOKINGS (used for conflict detection visual)
    // key: facilityId|YYYY-MM-DD -> array of booked "HH:00" start times
    // ---------------------------------------------------------------
    const today = new Date();
    const iso = (d) => d.toISOString().slice(0,10);
    const todayStr = iso(today);
    const tomorrowStr = iso(new Date(today.getTime() + 86400000));

    const EXISTING = {
        [`f1|${todayStr}`]: ['09:00','10:00','14:00'],
        [`f2|${todayStr}`]: ['08:00','11:00','12:00','13:00'],
        [`f3|${todayStr}`]: ['15:00','16:00'],
        [`f1|${tomorrowStr}`]: ['08:00'],
        [`f5|${todayStr}`]: ['10:00','11:00']
    };

    // User's own bookings (mock, in-memory)
    const currentUser = localStorage.getItem('currentUser') || 'Muhammad Harith Fahmi';
    const currentSid  = localStorage.getItem('currentStudentId') || 'S00000';
    let myBookings = [];

    // ---------------------------------------------------------------
    // RENDER: facility grid with filters
    // ---------------------------------------------------------------
    function typeLabel(t){ return t.charAt(0).toUpperCase()+t.slice(1); }

    function renderGrid() {
        const q = $('fSearch').value.trim().toLowerCase();
        const type = $('fType').value;
        const minCap = parseInt($('fCap').value, 10);
        const grid = $('grid');
        grid.innerHTML = '';

        const list = FACILITIES.filter(f => {
            if (q && !(f.name.toLowerCase().includes(q) || f.location.toLowerCase().includes(q))) return false;
            if (type && f.type !== type) return false;
            if (f.capacity < minCap) return false;
            return true;
        });

        if (!list.length) {
            grid.innerHTML = '<div class="bk-empty"><i class="bi bi-search"></i><br>NO FACILITIES MATCH</div>';
            return;
        }

        list.forEach(f => {
            const card = document.createElement('div');
            card.className = 'bk-card';
            const bookable = f.status === 'available';
            card.innerHTML = `
                <div class="c-top type-${f.type}">
                    <span>${typeLabel(f.type)}</span>
                    <span class="bk-status ${f.status}">${f.status.toUpperCase()}</span>
                </div>
                <div class="c-body">
                    <h3>${f.name}</h3>
                    <div class="bk-meta"><i class="bi bi-geo-alt-fill"></i> ${f.location}</div>
                    <div class="bk-meta"><i class="bi bi-people-fill"></i> Capacity: ${f.capacity}</div>
                    <div class="bk-tags">${f.equipment.map(e=>`<span class="bk-tag">${e}</span>`).join('')}</div>
                </div>
                <div class="c-foot">
                    <button class="btn btn-roblox ${bookable?'btn-success text-white':'btn-secondary text-white'}" ${bookable?'':'disabled'}>
                        <i class="bi bi-calendar-plus"></i> ${bookable?'BOOK NOW':(f.status==='maintenance'?'UNDER MAINTENANCE':'UNAVAILABLE')}
                    </button>
                </div>`;
            if (bookable) card.querySelector('button').onclick = () => openBookingModal(f);
            grid.appendChild(card);
        });
    }

    // ---------------------------------------------------------------
    // BOOKING MODAL
    // ---------------------------------------------------------------
    function bookedSlotsFor(facilityId, date) {
        const key = `${facilityId}|${date}`;
        const base = EXISTING[key] ? [...EXISTING[key]] : [];
        // include this session's own new bookings so conflicts persist
        myBookings.forEach(b => { if (b.facilityId===facilityId && b.date===date) base.push(b.slot); });
        return base;
    }

    function openBookingModal(f) {
        const back = document.createElement('div');
        back.className = 'bk-modal-backdrop';
        back.innerHTML = `
          <div class="bk-modal" role="dialog" aria-modal="true">
            <div class="bk-modal-head">
              <span><i class="bi bi-calendar-plus"></i> ${f.name}</span>
              <button class="x" aria-label="Close">&times;</button>
            </div>
            <div class="bk-modal-body">
              <div class="row g-3">
                <div class="col-md-7">
                  <label class="bk-mini-label" for="bkDate">Date</label>
                  <input type="date" id="bkDate" class="form-control bk-input" min="${todayStr}" value="${todayStr}">
                </div>
                <div class="col-md-5">
                  <label class="bk-mini-label">Capacity</label>
                  <input type="text" class="form-control bk-input" value="${f.capacity} people" readonly>
                </div>
                <div class="col-12">
                  <label class="bk-mini-label">Select Time Slot (1 hour)</label>
                  <div class="bk-slots" id="bkSlots"></div>
                  <div class="bk-legend">
                    <span><span class="dot free"></span> Available</span>
                    <span><span class="dot sel"></span> Selected</span>
                    <span><span class="dot busy"></span> Already booked</span>
                  </div>
                </div>
                <div class="col-12">
                  <label class="bk-mini-label" for="bkPurpose">Purpose <span style="color:var(--bk-red)">*</span></label>
                  <textarea id="bkPurpose" class="form-control bk-input" rows="2" maxlength="200" placeholder="e.g. Group study, project meeting, class replacement..."></textarea>
                </div>
              </div>
              <div class="bk-summary" id="bkSummary" style="display:none"></div>
            </div>
            <div class="bk-modal-foot">
              <button class="btn btn-roblox btn-light" data-close>CANCEL</button>
              <button class="btn btn-roblox btn-success text-white" id="bkConfirm" disabled><i class="bi bi-check2-circle"></i> CONFIRM BOOKING</button>
            </div>
          </div>`;

        let selectedSlot = null;
        const dateEl = back.querySelector('#bkDate');
        const slotsEl = back.querySelector('#bkSlots');
        const confirmBtn = back.querySelector('#bkConfirm');
        const summaryEl = back.querySelector('#bkSummary');

        function updateSummary() {
            const purpose = back.querySelector('#bkPurpose').value.trim();
            const canBook = selectedSlot && purpose.length >= 3;
            confirmBtn.disabled = !canBook;
            if (selectedSlot) {
                const end = String(parseInt(selectedSlot)+1).padStart(2,'0')+':00';
                summaryEl.style.display = 'block';
                summaryEl.innerHTML = `<b>SUMMARY</b><br>
                    ${f.name} &bull; ${dateEl.value}<br>
                    ${selectedSlot} – ${end} (1 hour)<br>
                    Booked by: ${currentUser} (${currentSid})`;
            } else {
                summaryEl.style.display = 'none';
            }
        }

        function renderSlots() {
            selectedSlot = null;
            const booked = bookedSlotsFor(f.id, dateEl.value);
            slotsEl.innerHTML = '';
            SLOTS.forEach(s => {
                const div = document.createElement('div');
                const isBooked = booked.includes(s);
                div.className = 'bk-slot' + (isBooked ? ' booked' : '');
                div.textContent = s;
                if (!isBooked) {
                    div.onclick = () => {
                        // CONFLICT DETECTION (client-side visual; DB exclusion constraint enforces real integrity)
                        if (bookedSlotsFor(f.id, dateEl.value).includes(s)) {
                            alert('That slot was just taken. Please choose another.');
                            renderSlots(); return;
                        }
                        slotsEl.querySelectorAll('.bk-slot').forEach(x=>x.classList.remove('selected'));
                        div.classList.add('selected');
                        selectedSlot = s;
                        updateSummary();
                    };
                }
                slotsEl.appendChild(div);
            });
            updateSummary();
        }

        dateEl.onchange = renderSlots;
        back.querySelector('#bkPurpose').addEventListener('input', updateSummary);

        confirmBtn.onclick = () => {
            // quota check (mirrors SRS check_quota())
            if (myBookings.length >= MAX_ACTIVE) {
                alert('Quota reached: you already have ' + MAX_ACTIVE + ' active bookings.');
                return;
            }
            const ref = 'BK-' + Math.floor(100000 + Math.random()*900000);
            const booking = {
                reference: ref,
                facilityId: f.id,
                facility: f.name,
                date: dateEl.value,
                slot: selectedSlot,
                purpose: back.querySelector('#bkPurpose').value.trim(),
                status: 'PENDING'
            };
            myBookings.push(booking);
            back.remove();
            renderMyBookings();
            renderQuota();
            showSuccess(booking);
            // Later: await supabaseClient.rpc('create_booking', {...})
        };

        function close(){ back.remove(); }
        back.querySelector('.x').onclick = close;
        back.querySelectorAll('[data-close]').forEach(b => b.onclick = close);
        back.addEventListener('click', (e)=>{ if(e.target===back) close(); });

        document.body.appendChild(back);
        renderSlots();
    }

    function showSuccess(b) {
        const back = document.createElement('div');
        back.className = 'bk-modal-backdrop';
        const end = String(parseInt(b.slot)+1).padStart(2,'0')+':00';
        back.innerHTML = `
          <div class="bk-modal" style="max-width:440px">
            <div class="bk-modal-head success"><span><i class="bi bi-check-circle-fill"></i> BOOKING REQUESTED</span></div>
            <div class="bk-modal-body text-center">
              <div class="bk-icon-big"><i class="bi bi-check-circle-fill"></i></div>
              <h5 class="font-bungee mb-1">Reservation Submitted</h5>
              <div class="bk-ref-badge">${b.reference}</div>
              <p class="small mb-0">${b.facility}<br>${b.date} &bull; ${b.slot}–${end}<br>
              Status: <b>PENDING APPROVAL</b></p>
            </div>
            <div class="bk-modal-foot">
              <button class="btn btn-roblox btn-success text-white" data-close>OK</button>
            </div>
          </div>`;
        const close=()=>back.remove();
        back.querySelectorAll('[data-close]').forEach(b=>b.onclick=close);
        back.addEventListener('click',(e)=>{if(e.target===back) close();});
        document.body.appendChild(back);
    }

    // ---------------------------------------------------------------
    // MY BOOKINGS + QUOTA
    // ---------------------------------------------------------------
    function renderMyBookings() {
        const wrap = $('myBookings');
        if (!myBookings.length) {
            wrap.innerHTML = '<p class="text-muted">You have no bookings yet. Pick a facility above to get started.</p>';
            return;
        }
        wrap.innerHTML = '';
        myBookings.forEach((b, i) => {
            const end = String(parseInt(b.slot)+1).padStart(2,'0')+':00';
            const row = document.createElement('div');
            row.className = 'bk-booking-row';
            row.innerHTML = `
              <div>
                <span class="b-ref">${b.reference}</span> &nbsp;
                <span class="bk-pill ${b.status}">${b.status}</span>
                <div class="small text-muted mt-1">${b.facility} &bull; ${b.date} &bull; ${b.slot}–${end}</div>
                <div class="small">${b.purpose}</div>
              </div>
              <button class="btn btn-roblox btn-light btn-sm"><i class="bi bi-x-circle"></i> CANCEL</button>`;
            row.querySelector('button').onclick = () => {
                if (confirm('Cancel booking ' + b.reference + '?')) {
                    myBookings.splice(i,1);
                    renderMyBookings();
                    renderQuota();
                }
            };
            wrap.appendChild(row);
        });
    }

    function renderQuota() {
        const active = myBookings.length;
        const hours = active; // 1h slots
        const a = $('qActive'), h = $('qHours');
        a.textContent = `${active} / ${MAX_ACTIVE}`;
        h.textContent = `${hours} / ${MAX_WEEK_HOURS}`;
        a.className = 'q-value ' + (active >= MAX_ACTIVE ? 'warn' : 'ok');
        h.className = 'q-value ' + (hours >= MAX_WEEK_HOURS ? 'warn' : 'ok');
    }

    // ---------------------------------------------------------------
    // INIT
    // ---------------------------------------------------------------
    document.addEventListener('DOMContentLoaded', () => {
        $('navUser').textContent = currentUser + ' (' + currentSid + ')';
        ['fSearch','fType','fCap'].forEach(id => {
            $(id).addEventListener('input', renderGrid);
            $(id).addEventListener('change', renderGrid);
        });
        $('fReset').onclick = () => { $('fSearch').value=''; $('fType').value=''; $('fCap').value='0'; renderGrid(); };
        renderGrid();
        renderMyBookings();
        renderQuota();
    });
})();
    </script>
</body>
</html>
